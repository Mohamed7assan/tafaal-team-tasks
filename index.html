/* ================= LESSON PACK PARSER (docx → lesson) =================
   Reads a Tafaal "Lesson Production Pack" .docx in the browser.
   Needs: JSZip (global) and DOMParser. Returns a plain object. */
const PackParser = (() => {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids = (el, name) => Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === name && n.namespaceURI === W);
  const clean = s => s.replace(/ /g, ' ').replace(/[ \t]+/g, ' ').trim();

  function paraText(p){
    let out = '';
    const walk = n => {
      for (const c of Array.from(n.childNodes)) {
        if (c.nodeType !== 1) continue;
        if (c.namespaceURI === W) {
          if (c.localName === 't') { out += c.textContent; continue; }
          if (c.localName === 'tab') { out += ' '; continue; }
          if (c.localName === 'br' || c.localName === 'cr') { out += '\n'; continue; }
          if (c.localName === 'tbl' || c.localName === 'pPr' || c.localName === 'rPr') continue;
        }
        walk(c);
      }
    };
    walk(p);
    return out.replace(/ /g, ' ');
  }
  const paraStyle = p => {
    const ppr = kids(p, 'pPr')[0]; const ps = ppr && kids(ppr, 'pStyle')[0];
    return ps ? ps.getAttributeNS(W, 'val') || ps.getAttribute('w:val') || '' : '';
  };
  function cellParas(tc){
    const out = [];
    for (const c of Array.from(tc.childNodes)) {
      if (c.nodeType !== 1 || c.namespaceURI !== W) continue;
      if (c.localName === 'p') out.push(paraText(c));
      else if (c.localName === 'tbl') tableRows(c).forEach(r => out.push(r.join(' | ')));
      else if (c.localName === 'sdt') { const sc = kids(c, 'sdtContent')[0]; if (sc) out.push(...cellParas(sc)); }
    }
    return out;
  }
  function tableRows(tbl){
    return kids(tbl, 'tr').map(tr => kids(tr, 'tc').map(tc => cellParas(tc).map(s => s.trim()).filter(Boolean).join('\n')));
  }
  function linearize(body){
    const nodes = [];
    for (const c of Array.from(body.childNodes)) {
      if (c.nodeType !== 1 || c.namespaceURI !== W) continue;
      if (c.localName === 'p') nodes.push({t:'p', style: paraStyle(c), text: clean(paraText(c))});
      else if (c.localName === 'tbl') nodes.push({t:'tbl', rows: tableRows(c)});
      else if (c.localName === 'sdt') { const sc = kids(c, 'sdtContent')[0]; if (sc) nodes.push(...linearize(sc)); }
    }
    return nodes;
  }

  const isCopyBlock = n => n && n.t === 'tbl' && n.rows.length === 1 && n.rows[0].length === 1 && /^\s*COPY INTO FLOW/i.test(n.rows[0][0]);
  function copyText(n){
    // first line is the "COPY INTO FLOW (…)" header; the rest are the prompt's paragraphs
    const lines = n.rows[0][0].split('\n').map(s => s.trim());
    lines.shift();
    return lines.filter(Boolean).join('\n\n').trim();
  }
  const kv = rows => { const o = {}; rows.forEach(r => { if (r.length >= 2) o[clean(r[0]).toLowerCase()] = r.slice(1).join('\n').trim(); }); return o; };
  const isBlank = s => !s || /^[_\s\-—–]+$/.test(s);
  const tableObjects = rows => {
    if (rows.length < 2) return [];
    const head = rows[0].map(h => clean(h).toLowerCase());
    return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });
  };
  const findCol = (obj, re) => { const k = Object.keys(obj).find(k => re.test(k)); return k ? obj[k] : ''; };
  const sectionOf = h => {
    const s = h.toLowerCase();
    if (/how to use/.test(s)) return 'howto';
    if (/asset/.test(s)) return 'assets';
    if (/scene chain/.test(s)) return 'chain';
    if (/reference matrix/.test(s)) return 'refs';
    if (/frame prompts?/.test(s)) return 'frames';
    if (/video prompts?/.test(s)) return 'videos';
    if (/tracker/.test(s)) return 'tracker';
    return 'other';
  };
  const frameCodes = s => (String(s).match(/\bF\d+\b/g) || []);

  async function parse(arrayBuffer){
    const zip = await JSZip.loadAsync(arrayBuffer);
    const xmlFile = zip.file('word/document.xml');
    if (!xmlFile) throw new Error('This is not a Word (.docx) file');
    const xml = await xmlFile.async('string');
    return parseXml(xml);
  }

  function parseXml(xml){
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const body = doc.getElementsByTagNameNS(W, 'body')[0];
    if (!body) throw new Error('Could not read the document body');
    const nodes = linearize(body);

    const res = {meta:{}, title:'', guide:[], escalation:'', errors:[], library:[], assets:[], frames:[], videos:[], chain:[], refs:[], warnings:[]};
    let sec = 'cover', cur = null;   // cur = the item a Heading2/Heading3 opened
    const coverTitle = [];

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.t === 'p') {
        if (/^Heading1$/i.test(n.style)) { sec = sectionOf(n.text); cur = null; continue; }
        if (/^Heading[23]$/i.test(n.style)) {
          const h = n.text;
          let m;
          if (/error codes?/i.test(h)) { cur = {type:'errors'}; continue; }
          if ((m = h.match(/^Save as:\s*(\S+)/i))) { cur = {type:'asset', code: m[1]}; continue; }
          if (sec === 'frames' && (m = h.match(/^(F\d+)\b\s*(?:[-—–]+\s*(.*))?$/))) { cur = {type:'frame', code:m[1], title:(m[2]||'').trim(), meta:null}; continue; }
          if (sec === 'videos' && (m = h.match(/^(V\d+)\b\s*(?:[-—–]+\s*(.*))?$/))) { cur = {type:'video', code:m[1], title:(m[2]||'').trim(), meta:null}; continue; }
          cur = {type:'other'}; continue;
        }
        if (sec === 'cover' && n.text) coverTitle.push(n.text);
        if (sec === 'howto' && n.text) {
          if (/^escalation/i.test(n.text)) res.escalation = n.text;
          else if (!cur) res.guide.push(n.text);
        }
        continue;
      }
      // tables
      if (sec === 'cover') { Object.assign(res.meta, kv(n.rows)); continue; }
      if (cur && cur.type === 'errors') {
        tableObjects(n.rows).forEach(o => {
          const code = findCol(o, /code/), problem = findCol(o, /problem|issue|desc/);
          if (code) res.errors.push({orig: code, problem});
        });
        cur = null; continue;
      }
      if (sec === 'assets' && !cur && !isCopyBlock(n)) {
        tableObjects(n.rows).forEach(o => {
          const file = findCol(o, /^file|name/); if (!file) return;
          res.library.push({file, usedFor: findCol(o, /used/), status: findCol(o, /status/)});
        });
        continue;
      }
      if (cur && cur.type === 'asset' && isCopyBlock(n)) {
        const lib = res.library.find(a => a.file === cur.code) || {};
        res.assets.push({code: cur.code, title: lib.usedFor || '', prompt: copyText(n)});
        cur = null; continue;
      }
      if (sec === 'chain' && !cur) { res.chain = tableObjects(n.rows); continue; }
      if (sec === 'refs' && !cur) { res.refs = tableObjects(n.rows); continue; }
      if (cur && (cur.type === 'frame' || cur.type === 'video')) {
        if (isCopyBlock(n)) {
          (cur.type === 'frame' ? res.frames : res.videos).push({code: cur.code, title: cur.title, meta: cur.meta || {}, prompt: copyText(n)});
          cur = null;
        } else cur.meta = kv(n.rows);
        continue;
      }
    }

    // ---- lesson meta ----
    const M = res.meta;
    res.title = (M['lesson'] && !isBlank(M['lesson'])) ? M['lesson'] : (coverTitle.find(t => !/^tafaal$|production pack|frames and videos/i.test(t)) || 'Untitled lesson');
    const info = {};
    Object.entries(M).forEach(([k, v]) => { if (k !== 'lesson' && !isBlank(v)) info[k.replace(/\b\w/g, c => c.toUpperCase())] = v; });
    res.info = info;

    // ---- error codes: F1… in the pack become E1… so they never clash with frame names ----
    res.errors = res.errors.map((e, i) => ({code: 'E' + ((e.orig.match(/\d+/) || [i + 1])[0]), orig: e.orig, problem: e.problem}));
    const errMap = Object.fromEntries(res.errors.map(e => [e.orig, e.code]));
    res.guide = res.guide.map(g => g.replace(/\(send a screenshot plus the code\)/i, '').trim()).filter(Boolean);

    // ---- assets ----
    const newAssets = new Set(res.library.filter(a => /new/i.test(a.status)).map(a => a.file));
    res.assets.forEach(a => newAssets.add(a.code));

    // ---- frames ----
    const chainByStart = {}, chainByVideo = {};
    res.chain.forEach((c, idx) => {
      const start = frameCodes(findCol(c, /^start/))[0];
      if (start) chainByStart[start] = c;
      chainByVideo['V' + (parseInt(findCol(c, /^#|^no/)) || idx + 1)] = c;
    });
    const refsByFrame = {};
    res.refs.forEach(r => { const f = frameCodes(findCol(r, /^frame/))[0]; if (f) refsByFrame[f] = r; });

    res.frames = res.frames.map((f, i) => {
      const m = f.meta;
      const uploads = (findCol(m, /upload/) || '').split('\n').map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
      const ref = refsByFrame[f.code];
      const refImgs = ref ? Object.keys(ref).filter(k => /image/.test(k)).map(k => ref[k]).filter(Boolean) : [];
      const imgs = uploads.length ? uploads : refImgs;
      const deps = new Set();
      imgs.forEach(s => {
        if (/approved frame/i.test(s)) frameCodes(s).forEach(c => deps.add(c));
        const file = (s.match(/ASSET_[\w.-]+\.png/i) || [])[0];
        if (file && newAssets.has(file)) deps.add(file);
      });
      const starts = findCol(m, /starts/), ends = findCol(m, /ends/);
      let title = f.title || (!isBlank(starts) ? starts : '') || (!isBlank(ends) ? ends : '');
      return {kind:'frame', code:f.code, seq:i + 1, title, prompt:f.prompt, deps:[...deps],
        meta:{starts: isBlank(starts) ? '' : starts, ends: isBlank(ends) ? '' : ends, uploads: imgs, check: findCol(m, /check/)}};
    });

    // ---- videos ----
    res.videos = res.videos.map((v, i) => {
      const m = v.meta, c = chainByVideo[v.code] || {};
      const start = frameCodes(findCol(m, /^start/) || findCol(c, /^start/))[0] || '';
      const end = frameCodes(findCol(m, /^end/) || findCol(c, /^end/))[0] || '';
      const passage = findCol(m, /passage/) || findCol(c, /passage/);
      const tafaal = /yes/i.test(findCol(c, /tafaal/));
      return {kind:'video', code:v.code, seq:i + 1, title:v.title || findCol(c, /title/), prompt:v.prompt,
        deps:[start, end].filter(Boolean),
        meta:{start, end, passage: isBlank(passage) ? '' : passage, tafaal, scene: findCol(c, /^scene/)}};
    });

    const assetItems = res.assets.map((a, i) => ({kind:'asset', code:a.code, seq:i + 1, title:a.title, prompt:a.prompt, deps:[], meta:{}}));

    // ---- checks ----
    if (!res.frames.length) res.warnings.push('No frame prompts (F1, F2…) were found.');
    if (!res.videos.length) res.warnings.push('No video prompts (V1, V2…) were found.');
    [...res.frames, ...res.videos, ...assetItems].forEach(it => { if (!it.prompt) res.warnings.push(`${it.code} has no prompt text.`); });
    const fset = new Set(res.frames.map(f => f.code));
    res.videos.forEach(v => v.deps.forEach(d => { if (!fset.has(d)) res.warnings.push(`${v.code} uses ${d}, which is not in the frames list.`); }));
    if (!res.errors.length) res.warnings.push('No error-code table was found.');

    return {
      title: res.title, info, guide: res.guide, escalation: res.escalation,
      errors: res.errors.map(({code, problem}) => ({code, problem})),
      library: res.library, items: [...assetItems, ...res.frames, ...res.videos], warnings: res.warnings,
    };
  }

  /* ---- passage: "[PASTE: Paragraph 2, sentence 5 + Paragraph 3, sentence 1]" → exact sentences ---- */
  const ABBR = /\b(Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|etc|e\.g|i\.e|No)\.$/i;
  function splitPassage(text){
    const paras = String(text || '').replace(/\r/g, '').split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean);
    return paras.map(p => {
      const out = []; let buf = '';
      const parts = p.split(/(?<=[.!?]["'”’)]?)\s+/);
      for (const part of parts) {
        buf = buf ? buf + ' ' + part : part;
        if (ABBR.test(buf)) continue;
        out.push(buf); buf = '';
      }
      if (buf) out.push(buf);
      return out;
    });
  }
  function nums(spec){
    const out = [];
    String(spec).replace(/\band\b/gi, ',').split(',').forEach(tok => {
      const m = tok.trim().match(/^(\d+)\s*(?:[-–—]+|to)\s*(\d+)$/);
      if (m) { for (let k = +m[1]; k <= +m[2]; k++) out.push(k); }
      else if (/^\d+$/.test(tok.trim())) out.push(+tok.trim());
    });
    return out;
  }
  // returns {text, missing:[…]} for a reference like "Paragraph 1, sentences 1–2"
  function resolveRef(ref, paras){
    const picked = [], missing = [];
    String(ref).split('+').forEach(part => {
      const m = part.match(/Paragraph\s+(\d+)\s*,?\s*sentences?\s+([\d\s,–—\-and to]+)/i);
      if (!m) { missing.push(part.trim()); return; }
      const p = +m[1];
      nums(m[2]).forEach(s => {
        const sent = paras[p - 1] && paras[p - 1][s - 1];
        if (sent) picked.push(sent); else missing.push(`Paragraph ${p}, sentence ${s}`);
      });
    });
    return {text: picked.join(' '), missing};
  }
  function fillPrompt(prompt, passageText){
    const paras = splitPassage(passageText);
    const missing = []; let used = false;
    const text = String(prompt).replace(/\[PASTE:\s*([^\]]+)\]/gi, (all, ref) => {
      used = true;
      if (!paras.length) { missing.push(ref.trim()); return all; }
      const r = resolveRef(ref, paras);
      if (r.missing.length || !r.text) { missing.push(...(r.missing.length ? r.missing : [ref.trim()])); return all; }
      return r.text;
    });
    return {text, used, missing};
  }

  /* ---- even split: the whole passage across n videos, ending at sentence ends ---- */
  const words = t => (String(t).trim().match(/\S+/g) || []).length;
  function sentencesOf(text){ return splitPassage(text).flat(); }
  // splits the sentences into n groups in order, keeping each group as close as possible
  // to the same word count (total ÷ n), never cutting a sentence
  function splitEvenly(text, n){
    const sents = sentencesOf(text);
    const total = sents.reduce((a, s) => a + words(s), 0);
    if (!n) return {chunks: [], total, target: 0, sentences: sents.length};
    if (!sents.length) return {chunks: Array(n).fill(''), total: 0, target: 0, sentences: 0};
    const m = sents.length, T = total / n, wc = sents.map(words);
    const pre = [0]; wc.forEach(w => pre.push(pre[pre.length - 1] + w));
    const k = Math.min(n, m);                 // groups that can hold at least one sentence
    // best[g][i] = lowest cost putting the first i sentences into g groups
    const best = Array.from({length: k + 1}, () => Array(m + 1).fill(Infinity));
    const from = Array.from({length: k + 1}, () => Array(m + 1).fill(0));
    best[0][0] = 0;
    for (let g = 1; g <= k; g++)
      for (let i = g; i <= m - (k - g); i++)
        for (let j = g - 1; j < i; j++) {
          if (best[g - 1][j] === Infinity) continue;
          const d = (pre[i] - pre[j]) - T, c = best[g - 1][j] + d * d;
          if (c < best[g][i]) { best[g][i] = c; from[g][i] = j; }
        }
    const cuts = []; let i = m;
    for (let g = k; g > 0; g--) { const j = from[g][i]; cuts.unshift([j, i]); i = j; }
    const chunks = cuts.map(([a, b]) => sents.slice(a, b).join(' '));
    while (chunks.length < n) chunks.push('');
    return {chunks, total, target: T, sentences: m};
  }
  // puts the chunk where the prompt says [PASTE: …]; extra [PASTE] marks in the same prompt are removed
  function fillChunk(prompt, chunk){
    let first = true;
    const has = /\[PASTE:[^\]]*\]/i.test(prompt || '');
    const text = String(prompt || '').replace(/\[PASTE:[^\]]*\]/gi, all => {
      if (!first) return '';
      first = false;
      return chunk ? chunk : all;
    });
    return {text, used: has, missing: has && !chunk};
  }

  return {parse, parseXml, splitPassage, fillPrompt, splitEvenly, fillChunk, words};
})();

/* ================= VIDEOS (lesson production packs) ================= */
let lessons = [], lessonStats = {}, curLesson = null, vItems = [], vProgress = {}, vErrors = [], vReports = [];
let myLessonAccess = null, myItemAccess = {}, lessonMembers = [], itemMembers = [];
let vTab = 'frame', vOpen = null, vProgTimer = null;
const vFilter = {status:'', mine:false, person:''};
const KIND_LABEL = {asset:'Assets', frame:'Frames', video:'Videos'};

const vByCode = code => vItems.find(i => i.code === code);
const TARGET_WORDS = 15;
// the videos that take narration, in order, and the passage split evenly across them
function narration(){
  const vids = vItems.filter(i => i.kind === 'video' && /\[PASTE:/i.test(i.prompt || '')).sort((a, b) => a.seq - b.seq);
  const sp = PackParser.splitEvenly(curLesson?.passage || '', vids.length);
  const map = {}; vids.forEach((v, k) => map[v.code] = sp.chunks[k] || '');
  return {vids, map, ...sp};
}
function promptFor(it){
  if (it.kind !== 'video') return {text: it.prompt || '', used: false, missing: false};
  return PackParser.fillChunk(it.prompt || '', narration().map[it.code] || '');
}
const vDone = code => !!vProgress[code]?.done;
const vWaiting = it => (it.deps || []).filter(d => !vDone(d));
const vStatus = it => vDone(it.code) ? 'done' : (vWaiting(it).length ? 'locked' : 'ready');
const vCanWork = it => isAdmin() || myLessonAccess === 'work' || myItemAccess[it.id] === 'work';
const shortCode = c => /^ASSET_/i.test(c) ? c.replace(/^ASSET_/i, '').replace(/\.png$/i, '') : c;

/* ---------- code ranges: "F1-F6, V3, all videos" ⇄ list of codes ---------- */
function parseCodes(text, items){
  const all = items.map(i => i.code), out = new Set(), unknown = [];
  const norm = String(text || '').replace(/\s*[-–—]\s*/g, '-').replace(/\ball\s+(frames|videos|assets)\b/gi, '@$1');
  norm.split(/[\s,;]+/).filter(Boolean).forEach(tok => {
    const k = tok.replace(/^@/, '').toLowerCase();
    if (['frames','videos','assets'].includes(k)) { items.filter(i => i.kind + 's' === k).forEach(i => out.add(i.code)); return; }
    let m = tok.match(/^([FV])(\d+)-[FV]?(\d+)$/i);
    if (m) {
      const p = m[1].toUpperCase(), a = +m[2], b = +m[3];
      for (let n = Math.min(a, b); n <= Math.max(a, b); n++) { const c = p + n; if (all.includes(c)) out.add(c); else unknown.push(c); }
      return;
    }
    const exact = all.find(c => c.toLowerCase() === tok.toLowerCase() || shortCode(c).toLowerCase() === tok.toLowerCase());
    if (exact) out.add(exact); else unknown.push(tok);
  });
  return {codes: [...out], unknown};
}
function compressCodes(codes){
  const groups = {F: [], V: []}, other = [];
  codes.forEach(c => { const m = c.match(/^([FV])(\d+)$/); if (m) groups[m[1]].push(+m[2]); else other.push(shortCode(c)); });
  const parts = [];
  ['F','V'].forEach(p => {
    const ns = [...new Set(groups[p])].sort((a, b) => a - b);
    for (let i = 0; i < ns.length; i++) {
      let j = i; while (j + 1 < ns.length && ns[j + 1] === ns[j] + 1) j++;
      parts.push(j > i ? `${p}${ns[i]}–${p}${ns[j]}` : `${p}${ns[i]}`); i = j;
    }
  });
  return [...parts, ...other].join(', ');
}

/* ---------- loading ---------- */
async function loadLessons(){
  const {data, error} = await sb.from('lessons').select('*').order('created_at', {ascending:false});
  if (error) { console.warn('lessons', error); lessons = []; updateNav(); return; }
  lessons = data;
  const stats = await Promise.all(lessons.map(l => sb.rpc('lesson_progress', {p_lesson: l.id})));
  lessonStats = {};
  lessons.forEach((l, i) => lessonStats[l.id] = stats[i].data || []);
  updateNav();
  if (!curLesson) renderLessonList();
}
function updateNav(){
  const showVideos = isAdmin() || lessons.length > 0;
  $('#navVideos').hidden = !showVideos;
  $('#navTeam').hidden = !isAdmin();
  $('#nav').hidden = !(showVideos || isAdmin());
}
async function loadProgress(){
  if (!curLesson) return;
  const {data, error} = await sb.rpc('lesson_progress', {p_lesson: curLesson.id});
  if (error) return console.warn(error);
  vProgress = {}; data.forEach(r => vProgress[r.code] = r);
  lessonStats[curLesson.id] = data;
}
async function openLesson(id){
  const l = lessons.find(x => x.id === id);
  if (!l) { await loadLessons(); if (!lessons.find(x => x.id === id)) return toast('This lesson is not available to you', true); }
  curLesson = lessons.find(x => x.id === id);
  vOpen = null; Object.assign(vFilter, {status:'', mine:false, person:''});
  switchView('videos');
  $('#lessonList').hidden = true; $('#lessonView').hidden = false;
  $('#lessonView').innerHTML = '<div class="empty">Loading…</div>';
  const q = [
    sb.from('lesson_items').select('*').eq('lesson_id', id).order('seq'),
    sb.from('lesson_errors').select('*').eq('lesson_id', id).order('seq'),
    sb.from('lesson_members').select('*').eq('lesson_id', id),
    sb.from('item_members').select('*').eq('lesson_id', id),
    loadProgress(),
    loadReports(false),
  ];
  const [it, er, lm, im] = await Promise.all(q);
  if (it.error) return fail(it.error);
  const order = {asset:0, frame:1, video:2};
  vItems = it.data.sort((a, b) => order[a.kind] - order[b.kind] || a.seq - b.seq);
  vErrors = er.data || [];
  lessonMembers = lm.data || []; itemMembers = im.data || [];
  myLessonAccess = lessonMembers.find(m => m.user_id === me.id)?.access || null;
  myItemAccess = {}; itemMembers.filter(m => m.user_id === me.id).forEach(m => myItemAccess[m.item_id] = m.access);
  // employees land on the first section they have work in
  const kinds = ['asset','frame','video'].filter(k => vItems.some(i => i.kind === k));
  const workKind = kinds.find(k => vItems.some(i => i.kind === k && vCanWork(i)));
  vTab = isAdmin() ? (kinds.includes('frame') ? 'frame' : kinds[0] || 'frame') : (workKind || kinds[0] || 'frame');
  clearInterval(vProgTimer);
  vProgTimer = setInterval(async () => { if (curLesson && !$('#view-videos').hidden) { await loadProgress(); renderLesson(); } }, 60 * 1000);
  renderLesson();
}
async function loadReports(render = true){
  if (!curLesson) return;
  const {data, error} = await sb.from('lesson_reports').select('*').eq('lesson_id', curLesson.id).order('created_at', {ascending:false});
  if (error) return console.warn(error);
  vReports = data;
  if (render) renderLesson();
}
function closeLesson(){
  curLesson = null; vItems = []; clearInterval(vProgTimer);
  $('#lessonView').hidden = true; $('#lessonList').hidden = false;
  loadLessons();
}

/* ---------- lesson list ---------- */
function statsOf(rows){
  const by = k => rows.filter(r => r.kind === k);
  const pct = rows.length ? Math.round(rows.filter(r => r.done).length / rows.length * 100) : 0;
  return {pct, done: rows.filter(r => r.done).length, total: rows.length,
    parts: ['asset','frame','video'].map(k => ({k, d: by(k).filter(r => r.done).length, t: by(k).length})).filter(p => p.t)};
}
const bar = (pct, cls = '') => `<div class="pbar ${cls}"><i style="width:${pct}%"></i></div>`;
function renderLessonList(){
  const el = $('#lessonList');
  el.innerHTML = `
    <div class="vhead">
      <div><h2 class="vh2">Video production</h2><div class="hint">Lesson packs for Flow — frames, videos and their prompts.</div></div>
      ${isAdmin() ? `<label class="btn" for="packFile">⬆ Upload lesson pack (.docx)</label><input type="file" id="packFile" accept=".docx" hidden>` : ''}
    </div>
    ${lessons.length ? `<div class="lgrid">${lessons.map(l => {
      const s = statsOf(lessonStats[l.id] || []);
      return `<button class="lcard" data-l="${l.id}">
        <div class="ltitle">${esc(l.title)}</div>
        ${l.info?.Passage ? `<div class="lsub">${esc(l.info.Passage)}</div>` : ''}
        <div class="lprog">${bar(s.pct)}<b>${s.pct}%</b></div>
        <div class="lsub">${s.parts.map(p => `${KIND_LABEL[p.k]} ${p.d}/${p.t}`).join(' · ') || 'No items'}</div>
      </button>`;
    }).join('')}</div>`
    : `<div class="empty">${isAdmin() ? 'No lessons yet — upload the first lesson pack.' : 'No lessons have been shared with you yet.'}</div>`}`;
  el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => openLesson(b.dataset.l));
  const f = $('#packFile'); if (f) f.onchange = () => { const file = f.files[0]; f.value = ''; if (file) importPack(file); };
}

/* ---------- import a pack ---------- */
async function importPack(file){
  if (!/\.docx$/i.test(file.name)) return toast('Choose the lesson pack as a .docx file', true);
  if (typeof JSZip === 'undefined') return toast('The Word reader did not load — check the internet connection and refresh', true);
  let pack;
  try { pack = await PackParser.parse(await file.arrayBuffer()); }
  catch (e) { console.error(e); return toast('Could not read this file: ' + e.message, true); }
  const n = k => pack.items.filter(i => i.kind === k).length;
  $('#formDlg').innerHTML = `
    <form id="packForm">
      <div class="dlg-head"><h2>New lesson from pack</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-body">
        <label for="pkTitle">Lesson title</label><input id="pkTitle" required value="${esc(pack.title)}">
        <div class="sec kv">
          <div><b>Assets</b>${n('asset')} new</div><div><b>Frames</b>${n('frame')}</div>
          <div><b>Videos</b>${n('video')}</div><div><b>Error codes</b>${pack.errors.length} (E1–E${pack.errors.length})</div>
        </div>
        ${pack.warnings.length ? `<div class="note ret"><b>Check these before creating:</b><br>${pack.warnings.map(esc).join('<br>')}</div>` : '<div class="note ok">Everything in the pack was read.</div>'}
        <label for="pkPassage">Reading passage (optional — you can add it later)</label>
        <textarea id="pkPassage" placeholder="Paste the passage here, one paragraph per line. It fills [PASTE: Paragraph 1, sentences 1–2] in the video prompts."></textarea>
        <div class="actions"><button class="btn" id="pkSave">Create lesson</button></div>
      </div>
    </form>`;
  $('#formDlg').showModal();
  $('#packForm').onsubmit = async e => {
    e.preventDefault();
    $('#pkSave').disabled = true;
    const {data: lesson, error} = await sb.from('lessons').insert({
      title: $('#pkTitle').value.trim() || pack.title, info: pack.info, guide: pack.guide, escalation: pack.escalation,
      library: pack.library, passage: $('#pkPassage').value.trim() || null,
    }).select().single();
    if (error) { $('#pkSave').disabled = false; return fail(error); }
    const {error: e2} = await sb.from('lesson_items').insert(pack.items.map(i => ({
      lesson_id: lesson.id, kind: i.kind, code: i.code, seq: i.seq, title: i.title, prompt: i.prompt, deps: i.deps, meta: i.meta})));
    if (e2) { await sb.from('lessons').delete().eq('id', lesson.id); $('#pkSave').disabled = false; return fail(e2); }
    if (pack.errors.length) await sb.from('lesson_errors').insert(pack.errors.map((x, i) => ({lesson_id: lesson.id, code: x.code, problem: x.problem, seq: i + 1})));
    $('#formDlg').close();
    toast(`Lesson "${lesson.title}" created`);
    await loadLessons();
    openLesson(lesson.id);
  };
}

/* ---------- lesson view ---------- */
function renderLesson(){
  if (!curLesson) return;
  const rows = Object.values(vProgress);
  const s = statsOf(rows);
  const kinds = ['asset','frame','video'].filter(k => vItems.some(i => i.kind === k));
  if (!kinds.includes(vTab) && !['passage','reports','guide','access'].includes(vTab)) vTab = kinds[0] || 'guide';
  const openReports = vReports.filter(r => r.status === 'open').length;

  // progress by person: work items assigned (whole lesson "work" counts everything) and what they ticked
  let people = '';
  if (isAdmin()) {
    const ppl = profiles.filter(p => p.active && (lessonMembers.some(m => m.user_id === p.id) || itemMembers.some(m => m.user_id === p.id) || rows.some(r => r.done_by === p.id)));
    people = ppl.map(p => {
      const whole = lessonMembers.find(m => m.user_id === p.id)?.access === 'work';
      const mineIds = whole ? vItems.map(i => i.id) : itemMembers.filter(m => m.user_id === p.id && m.access === 'work').map(m => m.item_id);
      const mine = vItems.filter(i => mineIds.includes(i.id));
      const d = mine.filter(i => vDone(i.code)).length;
      const pct = mine.length ? Math.round(d / mine.length * 100) : 0;
      return `<div class="pp"><span>${esc(p.full_name || p.email)}</span>${mine.length ? `${bar(pct, 'sm')}<small>${d}/${mine.length}</small>` : '<small>view only</small>'}</div>`;
    }).join('');
  } else {
    const mine = vItems.filter(vCanWork);
    if (mine.length) {
      const d = mine.filter(i => vDone(i.code)).length;
      people = `<div class="pp"><span>Your items</span>${bar(Math.round(d / mine.length * 100), 'sm')}<small>${d}/${mine.length}</small></div>`;
    }
  }

  const tabs = [...kinds.map(k => [k, `${KIND_LABEL[k]} <small>${vItems.filter(i => i.kind === k && vDone(i.code)).length}/${vItems.filter(i => i.kind === k).length}</small>`]),
    ['passage', 'Passage'], ['reports', `Reports${openReports ? ` <b class="cnt">${openReports}</b>` : ''}`], ['guide', 'Guide'],
    ...(isAdmin() ? [['access', 'Access']] : [])];

  $('#lessonView').innerHTML = `
    <button class="btn ghost sm" id="backLessons">← All lessons</button>
    <div class="lhead">
      <div class="lhead-main">
        <h2 class="vh2">${esc(curLesson.title)}</h2>
        <div class="chips">${Object.entries(curLesson.info || {}).filter(([k]) => /passage|world|flow/i.test(k)).map(([k, v]) => `<span class="chip"><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>
      </div>
      <div class="lhead-prog">
        <div class="lprog big">${bar(s.pct)}<b>${s.pct}%</b></div>
        <div class="lsub">${s.parts.map(p => `${KIND_LABEL[p.k]} ${p.d}/${p.t}`).join(' · ')}</div>
        ${people ? `<div class="people">${people}</div>` : ''}
      </div>
    </div>
    <div class="vtabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" class="${vTab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="vBody"></div>`;
  $('#backLessons').onclick = closeLesson;
  $('#lessonView').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { vTab = b.dataset.tab; vOpen = null; renderLesson(); });
  if (['asset','frame','video'].includes(vTab)) renderItems();
  else ({passage: renderPassage, reports: renderReports, guide: renderGuide, access: renderAccess})[vTab]();
}

function renderItems(){
  const workMine = vItems.some(i => i.kind === vTab && vCanWork(i)) && vItems.some(i => i.kind === vTab && !vCanWork(i));
  const admins = isAdmin();
  const assignees = it => {
    const ids = new Set(itemMembers.filter(m => m.item_id === it.id && m.access === 'work').map(m => m.user_id));
    lessonMembers.filter(m => m.access === 'work').forEach(m => ids.add(m.user_id));
    return [...ids];
  };
  let list = vItems.filter(i => i.kind === vTab);
  if (vFilter.status) list = list.filter(i => vStatus(i) === vFilter.status);
  if (vFilter.mine) list = list.filter(vCanWork);
  if (admins && vFilter.person) list = list.filter(i => assignees(i).includes(vFilter.person));
  const people = profiles.filter(p => p.active && (lessonMembers.some(m => m.user_id === p.id && m.access === 'work') || itemMembers.some(m => m.user_id === p.id && m.access === 'work')));

  $('#vBody').innerHTML = `
    <div class="vfilters">
      <div class="seg">${[['', 'All'], ['ready', 'Ready'], ['locked', 'Waiting'], ['done', 'Done']].map(([k, l]) => `<button class="${vFilter.status === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('')}</div>
      ${workMine ? `<label class="tog"><input type="checkbox" id="vMine" ${vFilter.mine ? 'checked' : ''}> Only items I work on</label>` : ''}
      ${admins && people.length ? `<label class="fgroup" style="flex:0 1 220px"><span>Assigned to</span><select id="vPerson"><option value="">Anyone</option>${people.map(p => `<option value="${p.id}" ${vFilter.person === p.id ? 'selected' : ''}>${esc(p.full_name || p.email)}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="vlist">${list.length ? list.map(it => itemRow(it, admins ? assignees(it) : [])).join('') : '<div class="empty">Nothing here with this filter.</div>'}</div>`;

  $('#vBody').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { vFilter.status = b.dataset.st; renderItems(); });
  const mineBox = $('#vMine'); if (mineBox) mineBox.onchange = () => { vFilter.mine = mineBox.checked; renderItems(); };
  const ps = $('#vPerson'); if (ps) ps.onchange = () => { vFilter.person = ps.value; renderItems(); };
  $('#vBody').querySelectorAll('.vrow').forEach(row => {
    const it = vItems.find(i => i.id === row.dataset.id);
    row.querySelector('[data-act="done"]')?.addEventListener('click', () => toggleDone(it));
    row.querySelector('[data-act="copy"]')?.addEventListener('click', () => copyPrompt(it));
    row.querySelector('[data-act="more"]')?.addEventListener('click', () => { vOpen = vOpen === it.id ? null : it.id; renderItems(); });
    row.querySelector('[data-act="report"]')?.addEventListener('click', () => openReportForm(it));
    row.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', () => jumpTo(a.dataset.jump)));
    row.querySelector('[data-act="copyfull"]')?.addEventListener('click', () => copyPrompt(it));
  });
  if (vOpen) { const r = $(`.vrow[data-id="${vOpen}"]`); if (r) r.scrollIntoView({block:'nearest'}); }
}

function depChip(code){
  const d = vDone(code), it = vByCode(code);
  const label = shortCode(code);
  return it ? `<button class="dep ${d ? 'ok' : ''}" data-jump="${esc(code)}" title="${d ? 'Done' : 'Not done yet'} — open ${esc(label)}">${d ? '✓' : '•'} ${esc(label)}</button>`
            : `<span class="dep ${d ? 'ok' : ''}" title="${d ? 'Done' : 'Not done yet'}">${d ? '✓' : '•'} ${esc(label)}</span>`;
}
function itemRow(it, assignedIds){
  const st = vStatus(it), work = vCanWork(it), waiting = vWaiting(it), open = vOpen === it.id;
  const p = vProgress[it.code] || {};
  const canTick = work && (st !== 'locked' || isAdmin() || vDone(it.code));
  const stChip = st === 'done' ? '<span class="badge s-ok">Done</span>'
    : st === 'locked' ? `<span class="badge s-prog">Waiting for ${esc(waiting.map(shortCode).join(', '))}</span>`
    : '<span class="badge s-new">Ready</span>';
  let links = '';
  if (it.kind === 'video') links = `<span class="flow">${depChip(it.meta.start)}<span class="arrow">→</span>${depChip(it.meta.end)}</span>`;
  else if (it.kind === 'frame') {
    const nextV = vItems.find(v => v.kind === 'video' && v.meta?.start === it.code);
    const deps = (it.deps || []).filter(d => d !== it.code);
    links = `${deps.length ? `<span class="flow"><small>Needs</small> ${deps.map(depChip).join('')}</span>` : ''}${nextV ? `<button class="vlink" data-jump="${esc(nextV.code)}" title="Video that starts with this frame">▶ ${esc(nextV.code)} · ${esc(nextV.meta.start)} → ${esc(nextV.meta.end)}</button>` : ''}`;
  }
  const filled = promptFor(it);
  const chunk = it.kind === 'video' && filled.used ? (narration().map[it.code] || '') : '';
  const who = assignedIds.length ? `<span class="who">👤 ${assignedIds.map(id => esc(nameOf(id))).join(', ')}</span>` : '';
  const doneBy = vDone(it.code) && p.done_by ? `<span class="who">✓ ${esc(nameOf(p.done_by))} · ${fmtDT(p.done_at)}</span>` : '';
  const openRep = vReports.filter(r => r.item_id === it.id && r.status === 'open').length;

  return `<div class="vrow st-${st} ${vDone(it.code) ? 'is-done' : ''} ${open ? 'open' : ''}" data-id="${it.id}">
    <div class="vline">
      <button class="vcheck" data-act="done" ${canTick ? '' : 'disabled'} aria-pressed="${vDone(it.code)}"
        title="${!work ? 'View only — you can’t mark this' : st === 'locked' && !vDone(it.code) && !isAdmin() ? 'Waiting for ' + waiting.join(', ') : vDone(it.code) ? 'Mark as not done' : 'Mark as done'}">${vDone(it.code) ? '✓' : ''}</button>
      <div class="vmain">
        <div class="vtop"><b class="vcode">${esc(shortCode(it.code))}</b><span class="vtitle">${esc(it.title || '')}</span></div>
        <div class="vsub">${stChip}${it.kind === 'video' && it.meta?.tafaal ? '<span class="badge prio p-flex">Tafaal in frame</span>' : ''}${chunk ? `<span class="badge prio p-low">${PackParser.words(chunk)} words</span>` : ''}${!work ? '<span class="badge prio p-low">View only</span>' : ''}${openRep ? `<span class="badge urgent">${openRep} report${openRep > 1 ? 's' : ''}</span>` : ''}${links}${who}${doneBy}</div>
      </div>
      <div class="vact">
        <button class="btn sm" data-act="copy" title="Copy the prompt for Flow">⧉ Copy prompt</button>
        <button class="btn ghost sm" data-act="more" aria-expanded="${open}">${open ? 'Hide' : 'Details'}</button>
        <button class="btn ghost sm" data-act="report" title="Report a problem">⚑</button>
      </div>
    </div>
    ${open ? `<div class="vdetail">
      ${it.kind === 'frame' && it.meta?.uploads?.length ? `<div class="dblock"><h4>Upload in this order</h4><ol class="ups">${it.meta.uploads.map(u => {
        const fc = (u.match(/\bF\d+\b/) || [])[0], af = (u.match(/ASSET_[\w.-]+\.png/i) || [])[0];
        const dep = fc && /approved/i.test(u) ? fc : af && vByCode(af) ? af : null;
        return `<li>${esc(u)} ${dep ? depChip(dep) : ''}</li>`; }).join('')}</ol></div>` : ''}
      ${it.kind === 'frame' && (it.meta?.starts || it.meta?.ends) ? `<div class="dblock kvs">${it.meta.starts ? `<div><b>Starts</b>${esc(it.meta.starts)}</div>` : ''}${it.meta.ends ? `<div><b>Ends</b>${esc(it.meta.ends)}</div>` : ''}</div>` : ''}
      ${it.kind === 'video' ? `<div class="dblock kvs"><div><b>Start frame</b>${esc(it.meta.start)}</div><div><b>End frame</b>${esc(it.meta.end)}</div>${chunk ? `<div><b>Narration</b>${PackParser.words(chunk)} words</div>` : ''}</div>` : ''}
      ${it.meta?.check ? `<div class="dblock"><h4>Check</h4><div class="check">${esc(it.meta.check)}</div></div>` : ''}
      ${filled.missing ? `<div class="note ret">${curLesson.passage ? 'The passage ran out before this video — it has too few sentences for all the story videos.' : 'No passage yet.'} ${isAdmin() ? 'Add or check it in the Passage tab.' : 'Ask an admin to add the passage.'} The prompt is copied with the [PASTE] line as it is.</div>` : ''}
      <div class="dblock"><h4>Prompt ${filled.used && !filled.missing ? '<small class="okt">passage filled in</small>' : ''}</h4><pre class="prompt">${esc(filled.text)}</pre>
        <div class="actions"><button class="btn sm" data-act="copyfull">⧉ Copy prompt</button></div></div>
    </div>` : ''}
  </div>`;
}

function jumpTo(code){
  const it = vByCode(code);
  if (!it) return toast(`${code} is not shared with you`, true);
  vTab = it.kind; vOpen = it.id; vFilter.status = ''; vFilter.mine = false; vFilter.person = '';
  renderLesson();
}

async function toggleDone(it){
  const to = !vDone(it.code);
  const {error} = await sb.rpc('set_item_done', {p_item: it.id, p_done: to});
  if (error) return fail(error);
  vProgress[it.code] = {...(vProgress[it.code] || {code: it.code, kind: it.kind}), done: to, done_by: to ? me.id : null, done_at: to ? new Date().toISOString() : null};
  toast(to ? `${shortCode(it.code)} done ✓` : `${shortCode(it.code)} marked as not done`);
  renderLesson();
  // tell the person what just unlocked
  if (to) {
    const unlocked = vItems.filter(x => (x.deps || []).includes(it.code) && vStatus(x) === 'ready' && vCanWork(x)).map(x => shortCode(x.code));
    if (unlocked.length) setTimeout(() => toast(`Now ready: ${unlocked.join(', ')}`), 1400);
  }
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
async function copyPrompt(it){
  const f = promptFor(it);
  const ok = await copyText(f.text);
  if (!ok) { vOpen = it.id; renderItems(); return toast('Copy was blocked — select the prompt under Details and copy it', true); }
  if (f.missing) toast(`Copied ${shortCode(it.code)} — but the passage is missing, the [PASTE] line is still in it`, true);
  else toast(`Copied ${shortCode(it.code)} prompt`);
}

/* ---------- passage tab ---------- */
function renderPassage(){
  const draft = isAdmin() && $('#psText') ? $('#psText').value : null;
  $('#vBody').innerHTML = `
    <div class="panel-card">
      <h2>Reading passage</h2>
      <p class="hint" style="margin:0 0 10px">Paste the whole passage. It's split evenly across the story videos (the ones with [PASTE]) in order —
        about ${TARGET_WORDS} words each, always ending at the end of a sentence — and each video's share goes in when you copy its prompt.</p>
      ${isAdmin() ? `<textarea id="psText" style="min-height:160px">${esc(draft ?? curLesson.passage ?? '')}</textarea>
        <div class="actions"><button class="btn" id="psSave">Save passage</button></div>` : ''}
      <div id="psOut"></div>
    </div>`;
  const show = text => { $('#psOut').innerHTML = splitPreview(text); };
  show(draft ?? curLesson.passage ?? '');
  if (isAdmin()) {
    $('#psText').oninput = () => show($('#psText').value);
    $('#psSave').onclick = async () => {
      const passage = $('#psText').value.trim() || null;
      const {error} = await sb.from('lessons').update({passage, updated_at: new Date().toISOString()}).eq('id', curLesson.id);
      if (error) return fail(error);
      curLesson.passage = passage; toast('Passage saved'); renderLesson();
    };
  }
}
function splitPreview(text){
  const vids = vItems.filter(i => i.kind === 'video' && /\[PASTE:/i.test(i.prompt || '')).sort((a, b) => a.seq - b.seq);
  if (!vids.length) return '<div class="hint">No video in this lesson has a [PASTE] line, so the passage isn\'t used.</div>';
  const sp = PackParser.splitEvenly(text || '', vids.length);
  if (!sp.total) return `<div class="hint">No passage yet. ${vids.length} story videos are waiting for it (${esc(compressCodes(vids.map(v => v.code)))}).</div>`;
  const avg = sp.total / vids.length, empty = sp.chunks.filter(c => !c).length;
  let warn = '';
  if (empty) warn = `The passage has only ${sp.sentences} sentence${sp.sentences > 1 ? 's' : ''} for ${vids.length} videos — ${empty} video${empty > 1 ? 's get' : ' gets'} nothing.`;
  else if (avg > TARGET_WORDS * 1.35) warn = `That's about ${Math.round(avg)} words per video — more than ${TARGET_WORDS}. The narrator may need to speak fast, or the lesson needs more story videos.`;
  else if (avg < TARGET_WORDS * 0.65) warn = `That's only about ${Math.round(avg)} words per video — fewer than ${TARGET_WORDS}.`;
  return `<div class="pssum"><b>${sp.total}</b> words · <b>${sp.sentences}</b> sentences · <b>${vids.length}</b> story videos · about <b>${Math.round(avg)}</b> words each</div>
    ${warn ? `<div class="note ret">${esc(warn)}</div>` : ''}
    <div class="psplit">${vids.map((v, k) => {
      const c = sp.chunks[k] || '', n = PackParser.words(c);
      const off = !c ? 'bad' : (n > TARGET_WORDS * 1.6 || n < TARGET_WORDS * 0.5) ? 'warn' : '';
      return `<div class="pschunk ${off}"><div class="psc-h"><b>${esc(v.code)}</b><span>${esc(v.title || '')}</span><small>${c ? n + ' words' : 'nothing'}</small></div>
        <div class="psc-t">${c ? esc(c) : '—'}</div></div>`;
    }).join('')}</div>`;
}

/* ---------- reports ---------- */
function openReportForm(it){
  $('#formDlg').innerHTML = `
    <form id="repForm">
      <div class="dlg-head"><h2>Report a problem · ${esc(shortCode(it.code))}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-body">
        <label for="rpCode">Problem</label>
        <select id="rpCode" required><option value="">Choose…</option>${vErrors.map(e => `<option value="${esc(e.code)}">${esc(e.code)} — ${esc(e.problem)}</option>`).join('')}<option value="Other">Other</option></select>
        <label for="rpNote">Note</label><textarea id="rpNote" placeholder="What went wrong? Which variant?"></textarea>
        <label for="rpShot">Screenshot</label>
        <input type="file" id="rpShot" accept="image/*">
        <div class="hint">Or paste a screenshot here with Ctrl + V. It's shrunk to a small image before sending.</div>
        <img id="rpPrev" class="shot-prev" hidden alt="Screenshot preview">
        ${curLesson.escalation ? `<div class="note sub">${esc(curLesson.escalation)}</div>` : ''}
        <div class="actions"><button class="btn" id="rpSend">Send report</button></div>
      </div>
    </form>`;
  $('#formDlg').showModal();
  let shot = null;
  const setShot = async file => {
    if (!file || !/^image\//.test(file.type)) return;
    try { shot = await shrinkImage(file); $('#rpPrev').src = URL.createObjectURL(shot); $('#rpPrev').hidden = false; }
    catch (e) { toast('Could not read that image', true); }
  };
  $('#rpShot').onchange = () => setShot($('#rpShot').files[0]);
  $('#repForm').onpaste = e => { const f = [...(e.clipboardData?.files || [])].find(f => /^image\//.test(f.type)); if (f) { e.preventDefault(); setShot(f); } };
  $('#repForm').onsubmit = async e => {
    e.preventDefault();
    $('#rpSend').disabled = true;
    let shot_path = null;
    if (shot) {
      shot_path = `${curLesson.id}/${it.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;
      const up = await sb.storage.from('report-shots').upload(shot_path, shot, {contentType: 'image/jpeg'});
      if (up.error) { $('#rpSend').disabled = false; return fail(up.error); }
    }
    const {error} = await sb.from('lesson_reports').insert({lesson_id: curLesson.id, item_id: it.id, error_code: $('#rpCode').value, note: $('#rpNote').value.trim() || null, shot_path});
    if (error) { $('#rpSend').disabled = false; return fail(error); }
    $('#formDlg').close(); toast('Report sent to the admins');
    loadReports();
  };
}
function shrinkImage(file, max = 1280, quality = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('encode')), 'image/jpeg', quality);
    };
    img.onerror = reject; img.src = url;
  });
}
const shotUrls = {};
async function renderReports(){
  const list = vReports;
  $('#vBody').innerHTML = list.length ? `<div class="replist">${list.map(r => {
    const it = vItems.find(i => i.id === r.item_id), err = vErrors.find(e => e.code === r.error_code);
    return `<div class="rep ${r.status}">
      <div class="rep-top"><b>${esc(it ? shortCode(it.code) : '—')}</b>
        <span class="badge ${r.status === 'open' ? 'urgent' : 's-ok'}">${r.status === 'open' ? 'Open' : 'Resolved'}</span>
        <span class="badge s-sub">${esc(r.error_code || '—')}${err ? ' · ' + esc(err.problem) : ''}</span>
        <span class="who">${esc(nameOf(r.user_id))} · ${fmtDT(r.created_at)}</span></div>
      ${r.note ? `<p>${esc(r.note)}</p>` : ''}
      ${r.shot_path ? `<a class="shot" data-shot="${esc(r.shot_path)}" href="#" target="_blank" rel="noopener"><img alt="Screenshot" data-img="${esc(r.shot_path)}"></a>` : ''}
      <div class="actions">${it ? `<button class="btn ghost sm" data-jump="${esc(it.code)}">Open ${esc(shortCode(it.code))}</button>` : ''}
        ${isAdmin() && r.status === 'open' ? `<button class="btn ok sm" data-resolve="${r.id}">✓ Mark resolved</button>` : ''}</div>
    </div>`; }).join('')}</div>`
    : `<div class="empty">No reports${isAdmin() ? ' for this lesson' : ' from you'} yet. Use ⚑ on any frame or video to report a problem.</div>`;
  $('#vBody').querySelectorAll('[data-jump]').forEach(b => b.onclick = () => jumpTo(b.dataset.jump));
  $('#vBody').querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => {
    const {error} = await sb.from('lesson_reports').update({status: 'resolved', resolved_by: me.id, resolved_at: new Date().toISOString()}).eq('id', b.dataset.resolve);
    if (error) return fail(error);
    toast('Report resolved'); loadReports();
  });
  for (const img of $('#vBody').querySelectorAll('[data-img]')) {
    const path = img.dataset.img;
    if (!shotUrls[path]) {
      const {data} = await sb.storage.from('report-shots').createSignedUrl(path, 60 * 60);
      shotUrls[path] = data?.signedUrl || '';
    }
    if (shotUrls[path]) { img.src = shotUrls[path]; img.parentElement.href = shotUrls[path]; }
    else img.parentElement.replaceWith(Object.assign(document.createElement('div'), {className: 'hint', textContent: 'Screenshot unavailable'}));
  }
}

/* ---------- guide ---------- */
function renderGuide(){
  const L = curLesson;
  $('#vBody').innerHTML = `
    <div class="panel-card"><h2>About this lesson</h2>
      <div class="kv">${Object.entries(L.info || {}).map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div></div>
    ${(L.guide || []).length ? `<div class="panel-card"><h2>How to use this pack</h2><ul class="glist">${L.guide.map(g => `<li>${esc(g)}</li>`).join('')}</ul>
      ${L.escalation ? `<div class="note sub">${esc(L.escalation)}</div>` : ''}</div>` : ''}
    ${vErrors.length ? `<div class="panel-card"><h2>Error codes</h2><p class="hint" style="margin:0 0 8px">Renamed from F1… to E1… so they never mix with frame names.</p>
      <div class="table-wrap"><table class="table"><tr><th>Code</th><th>Problem</th></tr>${vErrors.map(e => `<tr><td><b>${esc(e.code)}</b></td><td>${esc(e.problem)}</td></tr>`).join('')}</table></div></div>` : ''}
    ${(L.library || []).length ? `<div class="panel-card"><h2>Asset library</h2><div class="table-wrap"><table class="table"><tr><th>File</th><th>Used for</th><th>Status</th></tr>
      ${L.library.map(a => `<tr><td><code>${esc(a.file)}</code></td><td>${esc(a.usedFor)}</td><td><span class="badge ${/new/i.test(a.status) ? 's-new' : 's-ok'}">${esc(a.status)}</span></td></tr>`).join('')}</table></div></div>` : ''}`;
}

/* ---------- access (admin) ---------- */
function renderAccess(){
  const ppl = profiles.filter(p => p.active && p.role !== 'admin');
  const codesFor = (uid, acc) => itemMembers.filter(m => m.user_id === uid && m.access === acc).map(m => vItems.find(i => i.id === m.item_id)?.code).filter(Boolean);
  $('#vBody').innerHTML = `
    <div class="panel-card">
      <h2>Who sees what</h2>
      <p class="hint" style="margin:0 0 12px">Admins always see everything. For each person choose the whole lesson, or type the items:
        <code>F1-F12</code>, <code>V1-V10, V15</code>, <code>all frames</code>, <code>all videos</code>, <code>all assets</code>.
        <b>Work on</b> = can see and tick Done. <b>View</b> = can see and copy only.</p>
      ${ppl.length ? `<div class="acc-list">${ppl.map(p => {
        const la = lessonMembers.find(m => m.user_id === p.id)?.access || '';
        return `<div class="acc" data-u="${p.id}">
          <div class="acc-who"><b>${esc(p.full_name || p.email)}</b><small>${esc(jobName(p.job_role_id) || 'Employee')}</small></div>
          <label class="fgroup"><span>Whole lesson</span><select class="acc-l">
            <option value="" ${la === '' ? 'selected' : ''}>Only the items below</option>
            <option value="view" ${la === 'view' ? 'selected' : ''}>View everything</option>
            <option value="work" ${la === 'work' ? 'selected' : ''}>Work on everything</option></select></label>
          <label class="fgroup"><span>Work on</span><input class="acc-w" value="${esc(compressCodes(codesFor(p.id, 'work')))}" placeholder="e.g. V1-V10"></label>
          <label class="fgroup"><span>View</span><input class="acc-v" value="${esc(compressCodes(codesFor(p.id, 'view')))}" placeholder="e.g. all frames"></label>
          <button class="btn sm acc-save">Save</button>
        </div>`; }).join('')}</div>` : '<div class="hint">No employees yet — add them in the Team tab.</div>'}
    </div>
    <div class="panel-card">
      <h2>Lesson</h2>
      <div class="actions" style="margin:0"><button class="btn danger sm" id="delLesson">🗑 Delete lesson</button><span class="hint" id="delLessonHint" hidden></span></div>
    </div>`;
  $('#vBody').querySelectorAll('.acc').forEach(row => {
    row.querySelector('.acc-save').onclick = async () => {
      const w = parseCodes(row.querySelector('.acc-w').value, vItems), v = parseCodes(row.querySelector('.acc-v').value, vItems);
      const bad = [...w.unknown, ...v.unknown];
      if (bad.length) return toast(`Not in this lesson: ${bad.join(', ')}`, true);
      const {error} = await sb.rpc('set_member_access', {p_lesson: curLesson.id, p_user: row.dataset.u,
        p_lesson_access: row.querySelector('.acc-l').value || null, p_work: w.codes, p_view: v.codes.filter(c => !w.codes.includes(c))});
      if (error) return fail(error);
      const [lm, im] = await Promise.all([sb.from('lesson_members').select('*').eq('lesson_id', curLesson.id), sb.from('item_members').select('*').eq('lesson_id', curLesson.id)]);
      lessonMembers = lm.data || []; itemMembers = im.data || [];
      toast(`Saved for ${nameOf(row.dataset.u)}`);
      renderLesson();
    };
  });
  $('#delLesson').onclick = async e => {
    const b = e.currentTarget;
    if (b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.textContent = '🗑 Confirm delete';
      $('#delLessonHint').hidden = false; $('#delLessonHint').textContent = 'Deletes the lesson, its progress, access and reports.';
      return;
    }
    const shots = vReports.map(r => r.shot_path).filter(Boolean);
    if (shots.length) await sb.storage.from('report-shots').remove(shots);
    const {error} = await sb.from('lessons').delete().eq('id', curLesson.id);
    if (error) return fail(error);
    toast('Lesson deleted'); closeLesson();
  };
}

/* ---------- live updates ---------- */
let vRefreshTimer;
function onLessonItemChange(p){
  const row = p.new; if (!row || !curLesson || row.lesson_id !== curLesson.id) return;
  vProgress[row.code] = {...(vProgress[row.code] || {}), code: row.code, kind: row.kind, done: row.done, done_by: row.done_by, done_at: row.done_at};
  const it = vItems.find(i => i.id === row.id); if (it) Object.assign(it, {done: row.done, done_by: row.done_by, done_at: row.done_at});
  clearTimeout(vRefreshTimer);
  vRefreshTimer = setTimeout(async () => { await loadProgress(); if (!$('#view-videos').hidden && !$('#formDlg').open) renderLesson(); }, 400);
}

/* ---------- notifications ---------- */
function renderBell(){
  const n = notifs.filter(x => !x.read).length;
  $('#bellCount').hidden = !n; $('#bellCount').textContent = n > 99 ? '99+' : n;
  const p = $('#notifPanel');
  p.innerHTML = `<div class="nh">Notifications ${n ? `<button class="btn ghost sm" id="readAll">Mark all read</button>` : ''}</div>` +
    (notifs.length ? notifs.map(x => `<div class="notif ${x.read ? '' : 'unread'}" data-id="${x.id}" data-task="${x.task_id || ''}" data-lesson="${x.lesson_id || ''}">
      ${esc(x.message)}<small>${fmtDT(x.created_at)}</small></div>`).join('')
    : '<div class="notif" style="color:var(--muted);cursor:default">No notifications</div>');
  const ra = $('#readAll');
  if (ra) ra.onclick = async ev => {
    ev.stopPropagation();
    await sb.from('notifications').update({read: true}).eq('user_id', me.id).eq('read', false);
    notifs.forEach(x => x.read = true); renderBell();
  };
  p.querySelectorAll('.notif[data-id]').forEach(el => el.onclick = async () => {
    const x = notifs.find(y => y.id === el.dataset.id);
    if (x && !x.read) { x.read = true; sb.from('notifications').update({read: true}).eq('id', x.id).then(); renderBell(); }
    p.hidden = true;
    if (el.dataset.task) openTask(el.dataset.task);
    else if (el.dataset.lesson) { await openLesson(el.dataset.lesson); if (/reported/.test(x?.message || '')) { vTab = 'reports'; renderLesson(); } }
  });
}
$('#bellBtn').onclick = e => { e.stopPropagation(); $('#notifPanel').hidden = !$('#notifPanel').hidden; };
document.addEventListener('click', e => { if (!$('#notifPanel').contains(e.target)) $('#notifPanel').hidden = true; });

/* ---------- dialogs ---------- */
document.addEventListener('click', e => { if (e.target.matches('[data-close]')) e.target.closest('dialog').close(); });
$('#taskDlg').addEventListener('close', () => { currentTaskId = null; });

/* ---------- boot ---------- */
(async () => {
  if (SUPABASE_URL.includes('YOUR-PROJECT')) { showLogin('Add SUPABASE_URL and SUPABASE_ANON_KEY at the top of the code'); return; }
  const {data: {session}} = await sb.auth.getSession();
  if (session) await enter(session.user); else showLogin();
})();
</script>
