/* ================= LESSON PACK PARSER (docx → lesson) =================
   Reads a Tafaal "Lesson Production Pack" .docx in the browser.
   Needs: JSZip (global) and DOMParser. Returns a plain object. */
const PackParser = (() => {
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids = (el, name) => Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === name && n.namespaceURI === W);
  const clean = s => s.replace(/ /g, ' ').replace(/[ \t]+/g, ' ').trim();

  function paraText(p){
    let out = '';
    const walk = n => {
      for (const c of Array.from(n.childNodes)) {
        if (c.nodeType !== 1) continue;
        if (c.namespaceURI === W) {
          if (c.localName === 't') { out += c.textContent; continue; }
          if (c.localName === 'tab') { out += ' '; continue; }
          if (c.localName === 'br' || c.localName === 'cr') { out += '\n'; continue; }
          if (c.localName === 'tbl' || c.localName === 'pPr' || c.localName === 'rPr') continue;
        }
        walk(c);
      }
    };
    walk(p);
    return out.replace(/ /g, ' ');
  }
  const paraStyle = p => {
    const ppr = kids(p, 'pPr')[0]; const ps = ppr && kids(ppr, 'pStyle')[0];
    return ps ? ps.getAttributeNS(W, 'val') || ps.getAttribute('w:val') || '' : '';
  };
  function cellParas(tc){
    const out = [];
    for (const c of Array.from(tc.childNodes)) {
      if (c.nodeType !== 1 || c.namespaceURI !== W) continue;
      if (c.localName === 'p') out.push(paraText(c));
      else if (c.localName === 'tbl') tableRows(c).forEach(r => out.push(r.join(' | ')));
      else if (c.localName === 'sdt') { const sc = kids(c, 'sdtContent')[0]; if (sc) out.push(...cellParas(sc)); }
    }
    return out;
  }
  function tableRows(tbl){
    return kids(tbl, 'tr').map(tr => kids(tr, 'tc').map(tc => cellParas(tc).map(s => s.trim()).filter(Boolean).join('\n')));
  }
  function linearize(body){
    const nodes = [];
    for (const c of Array.from(body.childNodes)) {
      if (c.nodeType !== 1 || c.namespaceURI !== W) continue;
      if (c.localName === 'p') nodes.push({t:'p', style: paraStyle(c), text: clean(paraText(c))});
      else if (c.localName === 'tbl') nodes.push({t:'tbl', rows: tableRows(c)});
      else if (c.localName === 'sdt') { const sc = kids(c, 'sdtContent')[0]; if (sc) nodes.push(...linearize(sc)); }
    }
    return nodes;
  }

  const isCopyBlock = n => n && n.t === 'tbl' && n.rows.length === 1 && n.rows[0].length === 1 && /^\s*COPY INTO FLOW/i.test(n.rows[0][0]);
  function copyText(n){
    // first line is the "COPY INTO FLOW (…)" header; the rest are the prompt's paragraphs
    const lines = n.rows[0][0].split('\n').map(s => s.trim());
    lines.shift();
    return lines.filter(Boolean).join('\n\n').trim();
  }
  const kv = rows => { const o = {}; rows.forEach(r => { if (r.length >= 2) o[clean(r[0]).toLowerCase()] = r.slice(1).join('\n').trim(); }); return o; };
  const isBlank = s => !s || /^[_\s\-—–]+$/.test(s);
  const tableObjects = rows => {
    if (rows.length < 2) return [];
    const head = rows[0].map(h => clean(h).toLowerCase());
    return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });
  };
  const findCol = (obj, re) => { const k = Object.keys(obj).find(k => re.test(k)); return k ? obj[k] : ''; };
  const sectionOf = h => {
    const s = h.toLowerCase();
    if (/how to use/.test(s)) return 'howto';
    if (/asset/.test(s)) return 'assets';
    if (/scene chain/.test(s)) return 'chain';
    if (/reference matrix/.test(s)) return 'refs';
    if (/frame prompts?/.test(s)) return 'frames';
    if (/video prompts?/.test(s)) return 'videos';
    if (/tracker/.test(s)) return 'tracker';
    return 'other';
  };
  const frameCodes = s => (String(s).match(/\bF\d+\b/g) || []);

  async function parse(arrayBuffer){
    const zip = await JSZip.loadAsync(arrayBuffer);
    const xmlFile = zip.file('word/document.xml');
    if (!xmlFile) throw new Error('This is not a Word (.docx) file');
    const xml = await xmlFile.async('string');
    return parseXml(xml);
  }

  function parseXml(xml){
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const body = doc.getElementsByTagNameNS(W, 'body')[0];
    if (!body) throw new Error('Could not read the document body');
    const nodes = linearize(body);

    const res = {meta:{}, title:'', guide:[], escalation:'', errors:[], library:[], assets:[], frames:[], videos:[], chain:[], refs:[], warnings:[]};
    let sec = 'cover', cur = null;   // cur = the item a Heading2/Heading3 opened
    const coverTitle = [];

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.t === 'p') {
        if (/^Heading1$/i.test(n.style)) { sec = sectionOf(n.text); cur = null; continue; }
        if (/^Heading[23]$/i.test(n.style)) {
          const h = n.text;
          let m;
          if (/error codes?/i.test(h)) { cur = {type:'errors'}; continue; }
          if ((m = h.match(/^Save as:\s*(\S+)/i))) { cur = {type:'asset', code: m[1]}; continue; }
          if (sec === 'frames' && (m = h.match(/^(F\d+)\b\s*(?:[-—–]+\s*(.*))?$/))) { cur = {type:'frame', code:m[1], title:(m[2]||'').trim(), meta:null}; continue; }
          if (sec === 'videos' && (m = h.match(/^(V\d+)\b\s*(?:[-—–]+\s*(.*))?$/))) { cur = {type:'video', code:m[1], title:(m[2]||'').trim(), meta:null}; continue; }
          cur = {type:'other'}; continue;
        }
        if (sec === 'cover' && n.text) coverTitle.push(n.text);
        if (sec === 'howto' && n.text) {
          if (/^escalation/i.test(n.text)) res.escalation = n.text;
          else if (!cur) res.guide.push(n.text);
        }
        continue;
      }
      // tables
      if (sec === 'cover') { Object.assign(res.meta, kv(n.rows)); continue; }
      if (cur && cur.type === 'errors') {
        tableObjects(n.rows).forEach(o => {
          const code = findCol(o, /code/), problem = findCol(o, /problem|issue|desc/);
          if (code) res.errors.push({orig: code, problem});
        });
        cur = null; continue;
      }
      if (sec === 'assets' && !cur && !isCopyBlock(n)) {
        tableObjects(n.rows).forEach(o => {
          const file = findCol(o, /^file|name/); if (!file) return;
          res.library.push({file, usedFor: findCol(o, /used/), status: findCol(o, /status/)});
        });
        continue;
      }
      if (cur && cur.type === 'asset' && isCopyBlock(n)) {
        const lib = res.library.find(a => a.file === cur.code) || {};
        res.assets.push({code: cur.code, title: lib.usedFor || '', prompt: copyText(n)});
        cur = null; continue;
      }
      if (sec === 'chain' && !cur) { res.chain = tableObjects(n.rows); continue; }
      if (sec === 'refs' && !cur) { res.refs = tableObjects(n.rows); continue; }
      if (cur && (cur.type === 'frame' || cur.type === 'video')) {
        if (isCopyBlock(n)) {
          (cur.type === 'frame' ? res.frames : res.videos).push({code: cur.code, title: cur.title, meta: cur.meta || {}, prompt: copyText(n)});
          cur = null;
        } else cur.meta = kv(n.rows);
        continue;
      }
    }

    // ---- lesson meta ----
    const M = res.meta;
    res.title = (M['lesson'] && !isBlank(M['lesson'])) ? M['lesson'] : (coverTitle.find(t => !/^tafaal$|production pack|frames and videos/i.test(t)) || 'Untitled lesson');
    const coverText = Object.values(M).join(' \n ') + ' ' + coverTitle.join(' ');
    const num = re => { const m = coverText.match(re); return m ? m[1] : ''; };
    res.grade = num(/\bGrade\s*[:#]?\s*(\d+)/i);
    res.unit  = num(/\bUnit\s*[:#]?\s*(\d+)/i);
    res.page  = num(/\b(?:Page|p\.)\s*[:#]?\s*(\d+)/i);
    const info = {};
    Object.entries(M).forEach(([k, v]) => { if (k !== 'lesson' && !isBlank(v)) info[k.replace(/\b\w/g, c => c.toUpperCase())] = v; });
    res.info = info;

    // ---- error codes: F1… in the pack become E1… so they never clash with frame names ----
    res.errors = res.errors.map((e, i) => ({code: 'E' + ((e.orig.match(/\d+/) || [i + 1])[0]), orig: e.orig, problem: e.problem}));
    const errMap = Object.fromEntries(res.errors.map(e => [e.orig, e.code]));
    res.guide = res.guide.map(g => g.replace(/\(send a screenshot plus the code\)/i, '').trim()).filter(Boolean);

    // ---- assets ----
    const newAssets = new Set(res.library.filter(a => /new/i.test(a.status)).map(a => a.file));
    res.assets.forEach(a => newAssets.add(a.code));

    // ---- frames ----
    const chainByStart = {}, chainByVideo = {};
    res.chain.forEach((c, idx) => {
      const start = frameCodes(findCol(c, /^start/))[0];
      if (start) chainByStart[start] = c;
      chainByVideo['V' + (parseInt(findCol(c, /^#|^no/)) || idx + 1)] = c;
    });
    const refsByFrame = {};
    res.refs.forEach(r => { const f = frameCodes(findCol(r, /^frame/))[0]; if (f) refsByFrame[f] = r; });

    res.frames = res.frames.map((f, i) => {
      const m = f.meta;
      const uploads = (findCol(m, /upload/) || '').split('\n').map(s => s.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
      const ref = refsByFrame[f.code];
      const refImgs = ref ? Object.keys(ref).filter(k => /image/.test(k)).map(k => ref[k]).filter(Boolean) : [];
      const imgs = uploads.length ? uploads : refImgs;
      const deps = new Set();
      imgs.forEach(s => {
        if (/approved frame/i.test(s)) frameCodes(s).forEach(c => deps.add(c));
        const file = (s.match(/ASSET_[\w.-]+\.png/i) || [])[0];
        if (file && newAssets.has(file)) deps.add(file);
      });
      const starts = findCol(m, /starts/), ends = findCol(m, /ends/);
      let title = f.title || (!isBlank(starts) ? starts : '') || (!isBlank(ends) ? ends : '');
      return {kind:'frame', code:f.code, seq:i + 1, title, prompt:f.prompt, deps:[...deps],
        meta:{starts: isBlank(starts) ? '' : starts, ends: isBlank(ends) ? '' : ends, uploads: imgs, check: findCol(m, /check/)}};
    });

    // ---- videos ----
    res.videos = res.videos.map((v, i) => {
      const m = v.meta, c = chainByVideo[v.code] || {};
      const start = frameCodes(findCol(m, /^start/) || findCol(c, /^start/))[0] || '';
      const end = frameCodes(findCol(m, /^end/) || findCol(c, /^end/))[0] || '';
      const passage = findCol(m, /passage/) || findCol(c, /passage/);
      const tafaal = /yes/i.test(findCol(c, /tafaal/));
      return {kind:'video', code:v.code, seq:i + 1, title:v.title || findCol(c, /title/), prompt:v.prompt,
        deps:[start, end].filter(Boolean),
        meta:{start, end, passage: isBlank(passage) ? '' : passage, tafaal, scene: findCol(c, /^scene/)}};
    });

    const assetItems = res.assets.map((a, i) => ({kind:'asset', code:a.code, seq:i + 1, title:a.title, prompt:a.prompt, deps:[], meta:{}}));

    // ---- checks ----
    if (!res.frames.length) res.warnings.push('No frame prompts (F1, F2…) were found.');
    if (!res.videos.length) res.warnings.push('No video prompts (V1, V2…) were found.');
    [...res.frames, ...res.videos, ...assetItems].forEach(it => { if (!it.prompt) res.warnings.push(`${it.code} has no prompt text.`); });
    const fset = new Set(res.frames.map(f => f.code));
    res.videos.forEach(v => v.deps.forEach(d => { if (!fset.has(d)) res.warnings.push(`${v.code} uses ${d}, which is not in the frames list.`); }));
    if (!res.errors.length) res.warnings.push('No error-code table was found.');

    return {
      title: res.title, grade: res.grade, unit: res.unit, page: res.page, info, guide: res.guide, escalation: res.escalation,
      errors: res.errors.map(({code, problem}) => ({code, problem})),
      library: res.library, items: [...assetItems, ...res.frames, ...res.videos], warnings: res.warnings,
    };
  }

  /* ---- passage: "[PASTE: Paragraph 2, sentence 5 + Paragraph 3, sentence 1]" → exact sentences ---- */
  const ABBR = /\b(Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|etc|e\.g|i\.e|No)\.$/i;
  function splitPassage(text){
    const paras = String(text || '').replace(/\r/g, '').split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean);
    return paras.map(p => {
      const out = []; let buf = '';
      const parts = p.split(/(?<=[.!?]["'”’)]?)\s+/);
      for (const part of parts) {
        buf = buf ? buf + ' ' + part : part;
        if (ABBR.test(buf)) continue;
        out.push(buf); buf = '';
      }
      if (buf) out.push(buf);
      return out;
    });
  }
  function nums(spec){
    const out = [];
    String(spec).replace(/\band\b/gi, ',').split(',').forEach(tok => {
      const m = tok.trim().match(/^(\d+)\s*(?:[-–—]+|to)\s*(\d+)$/);
      if (m) { for (let k = +m[1]; k <= +m[2]; k++) out.push(k); }
      else if (/^\d+$/.test(tok.trim())) out.push(+tok.trim());
    });
    return out;
  }
  // returns {text, missing:[…]} for a reference like "Paragraph 1, sentences 1–2"
  function resolveRef(ref, paras){
    const picked = [], missing = [];
    String(ref).split('+').forEach(part => {
      const m = part.match(/Paragraph\s+(\d+)\s*,?\s*sentences?\s+([\d\s,–—\-and to]+)/i);
      if (!m) { missing.push(part.trim()); return; }
      const p = +m[1];
      nums(m[2]).forEach(s => {
        const sent = paras[p - 1] && paras[p - 1][s - 1];
        if (sent) picked.push(sent); else missing.push(`Paragraph ${p}, sentence ${s}`);
      });
    });
    return {text: picked.join(' '), missing};
  }
  function fillPrompt(prompt, passageText){
    const paras = splitPassage(passageText);
    const missing = []; let used = false;
    const text = String(prompt).replace(/\[PASTE:\s*([^\]]+)\]/gi, (all, ref) => {
      used = true;
      if (!paras.length) { missing.push(ref.trim()); return all; }
      const r = resolveRef(ref, paras);
      if (r.missing.length || !r.text) { missing.push(...(r.missing.length ? r.missing : [ref.trim()])); return all; }
      return r.text;
    });
    return {text, used, missing};
  }

  /* ---- even split: the whole passage across n videos, ending at sentence ends ---- */
  const words = t => (String(t).trim().match(/\S+/g) || []).length;
  // the passage is often pasted from a PDF with line breaks in the middle of sentences:
  // join every line into one text first ("adven-\nture" → "adventure"), then split into sentences
  function sentencesOf(text){
    const flat = String(text || '').replace(/\r/g, '')
      .replace(/(\w)-\n\s*(?=[a-z])/g, '$1')
      .replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
    return flat ? splitPassage(flat).flat() : [];
  }
  // splits the sentences into n groups in order, keeping each group as close as possible
  // to the same word count (total ÷ n), never cutting a sentence
  function splitEvenly(text, n){
    const sents = sentencesOf(text);
    const total = sents.reduce((a, s) => a + words(s), 0);
    if (!n) return {chunks: [], total, target: 0, sentences: sents.length};
    if (!sents.length) return {chunks: Array(n).fill(''), total: 0, target: 0, sentences: 0};
    const m = sents.length, T = total / n, wc = sents.map(words);
    const pre = [0]; wc.forEach(w => pre.push(pre[pre.length - 1] + w));
    const k = Math.min(n, m);                 // groups that can hold at least one sentence
    // best[g][i] = lowest cost putting the first i sentences into g groups
    const best = Array.from({length: k + 1}, () => Array(m + 1).fill(Infinity));
    const from = Array.from({length: k + 1}, () => Array(m + 1).fill(0));
    best[0][0] = 0;
    for (let g = 1; g <= k; g++)
      for (let i = g; i <= m - (k - g); i++)
        for (let j = g - 1; j < i; j++) {
          if (best[g - 1][j] === Infinity) continue;
          const d = (pre[i] - pre[j]) - T, c = best[g - 1][j] + d * d;
          if (c < best[g][i]) { best[g][i] = c; from[g][i] = j; }
        }
    const cuts = []; let i = m;
    for (let g = k; g > 0; g--) { const j = from[g][i]; cuts.unshift([j, i]); i = j; }
    const chunks = cuts.map(([a, b]) => sents.slice(a, b).join(' '));
    while (chunks.length < n) chunks.push('');
    return {chunks, total, target: T, sentences: m};
  }
  // puts the chunk where the prompt says [PASTE: …]; extra [PASTE] marks in the same prompt are removed
  function fillChunk(prompt, chunk){
    let first = true;
    const has = /\[PASTE:[^\]]*\]/i.test(prompt || '');
    const text = String(prompt || '').replace(/\[PASTE:[^\]]*\]/gi, all => {
      if (!first) return '';
      first = false;
      return chunk ? chunk : all;
    });
    return {text, used: has, missing: has && !chunk};
  }

  /* ---- exact dialogue lines named by the pack ----
     [PASTE: Seth: From "What do you do here…" to "…Dr. Sullivan?" then Parrot: "No, he won't!"] */
  const Q = '"“”';
  function parseSpec(spec){
    const s = String(spec || '').replace(/\(\d+\s*words?\)/gi, '').trim();
    if (!/["“”]/.test(s)) return null;                 // old style ("Paragraph 1, sentences 1–2")
    // split on "then" that is outside quotes
    const parts = []; let buf = '', inQ = false;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (Q.includes(ch)) inQ = ch === '“' ? true : ch === '”' ? false : !inQ;
      if (!inQ && /^\s+then\s+/i.test(s.slice(i)) ) { parts.push(buf); buf = ''; i += s.slice(i).match(/^\s+then\s+/i)[0].length - 1; continue; }
      buf += ch;
    }
    if (buf.trim()) parts.push(buf);
    const segs = parts.map(p => {
      p = p.trim();
      const sp = p.match(/^([^:"“”]{1,40}):\s*(.*)$/s);
      const speaker = sp ? sp[1].trim() : '';
      const rest = sp ? sp[2].trim() : p;
      const qs = [...rest.matchAll(/["“]([^"“”]*)["”]/g)].map(m => m[1].trim());
      if (/^from\b/i.test(rest) && qs.length >= 2) return {speaker, from: qs[0], to: qs[1]};
      if (qs.length >= 1) return {speaker, quote: qs.join(' ')};
      return null;
    });
    return segs.every(Boolean) && segs.length ? segs : null;
  }
  // normalise for matching (case, quotes, apostrophes, dashes, ellipses, spaces) and keep a map back to the original
  function norm(text){
    let out = '', map = [];
    const t = String(text || '');
    for (let i = 0; i < t.length; i++) {
      let ch = t[i];
      if ('‘’ʼ`'.includes(ch)) ch = "'";
      if ('"“”'.includes(ch)) continue;
      if (ch === '…') continue;
      if (ch === '.' && t[i + 1] === '.' ) { while (t[i + 1] === '.') i++; continue; }
      if ('–—'.includes(ch)) ch = '-';
      if (/\s/.test(ch)) { if (out.endsWith(' ') || !out) continue; ch = ' '; }
      out += ch.toLowerCase(); map.push(i);
    }
    return {s: out, map};
  }
  const trimEll = s => String(s).replace(/^[\s.…]+|[\s…]+$/g, '').replace(/\.\.\.$/, '').trim();
  // finds `from` … `to` in the passage, starting at cursor; returns the original text
  function findRange(P, from, to, cursor){
    const f = norm(trimEll(from)).s.trim(), t = norm(trimEll(to)).s.trim();
    if (!f) return null;
    const tryAt = start => {
      const a = P.n.s.indexOf(f, start); if (a < 0) return null;
      let z;
      if (!t) z = a + f.length;
      else { const b = P.n.s.indexOf(t, a); if (b < 0) return null; z = b + t.length; }
      return {a, z};
    };
    const hit = tryAt(cursor) || tryAt(0);
    if (!hit) return null;
    const o1 = P.n.map[hit.a], o2 = P.n.map[hit.z - 1] + 1;
    return {text: P.raw.slice(o1, o2).replace(/\s+/g, ' ').trim(), end: hit.z};
  }
  function resolveDialogue(segs, passage, cursor = 0){
    const raw = String(passage || '').replace(/\r/g, '');
    const P = {raw, n: norm(raw)};
    const out = [], missing = [];
    for (const g of segs) {
      let text = '';
      if (g.quote) {
        const r = raw ? findRange(P, g.quote, '', cursor) : null;   // prefer the passage's own wording
        text = r ? r.text : g.quote;
        if (r) cursor = r.end;
      } else {
        const r = raw ? findRange(P, g.from, g.to, cursor) : null;
        if (r) { text = r.text; cursor = r.end; }
        else missing.push(`${g.speaker ? g.speaker + ': ' : ''}"${g.from}" … "${g.to}"`);
      }
      // drop a speaker label the passage may carry inside the range, and outer quotes
      if (text && g.speaker) text = text.replace(new RegExp('^' + g.speaker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:\\s*', 'i'), '');
      text = text.replace(/^["“]+|["”]+$/g, '').trim();
      if (text) out.push(g.speaker ? `${g.speaker}: "${text}"` : `"${text}"`);
    }
    return {text: missing.length ? '' : out.join(' '), missing, cursor};
  }

  return {parse, parseXml, splitPassage, fillPrompt, splitEvenly, fillChunk, words, parseSpec, resolveDialogue};
})();

/* ================= VIDEOS (lesson production packs) ================= */
let folders = [], folderMembers = [], curFolder = null, myFolderAccess = null;
let lessons = [], lessonStats = {}, curLesson = null, vItems = [], vProgress = {}, vErrors = [], vReports = [];
let myLessonAccess = null, myItemAccess = {}, lessonMembers = [], itemMembers = [];
let vTab = 'frame', vOpen = null, vProgTimer = null;
const vFilter = {status:'', mine:false, person:''};
const KIND_LABEL = {asset:'Assets', frame:'Frames', video:'Videos'};

const vByCode = code => vItems.find(i => i.code === code);
const TARGET_WORDS = 15;
// what each story video says. If the pack names the exact lines (Seth: From "…" to "…"), those are found in the
// passage; otherwise (older packs) the passage is split evenly across the [PASTE] videos.
let _narr = null;
function narration(){
  const key = (curLesson?.id || '') + '|' + (curLesson?.passage || '') + '|' + vItems.length;
  if (_narr && _narr.key === key) return _narr;
  const vids = vItems.filter(i => i.kind === 'video' && /\[PASTE:/i.test(i.prompt || '')).sort((a, b) => a.seq - b.seq);
  const map = {}, exact = [], even = [];
  vids.forEach(v => {
    const m = (v.prompt || '').match(/\[PASTE:\s*([\s\S]*?)\]/i);
    const segs = m ? PackParser.parseSpec(m[1]) : null;
    (segs ? exact : even).push({v, segs});
  });
  let cursor = 0;
  exact.forEach(({v, segs}) => {
    const r = PackParser.resolveDialogue(segs, curLesson?.passage || '', cursor);
    cursor = r.cursor;
    map[v.code] = {text: r.text, missing: r.missing, mode: 'exact'};
  });
  const sp = PackParser.splitEvenly(curLesson?.passage || '', even.length);
  even.forEach(({v}, k) => map[v.code] = {text: sp.chunks[k] || '', missing: sp.chunks[k] ? [] : ['passage'], mode: 'even'});
  _narr = {key, vids, map, mode: exact.length ? 'exact' : 'even', ...sp};
  return _narr;
}
function promptFor(it){
  if (it.kind !== 'video') return {text: it.prompt || '', used: false, missing: false};
  const n = narration().map[it.code];
  if (!n) return {text: it.prompt || '', used: false, missing: false};
  return PackParser.fillChunk(it.prompt || '', n.text || '');
}
const vDone = code => !!vProgress[code]?.done;
const vWaiting = it => (it.deps || []).filter(d => !vDone(d));
const vStatus = it => vDone(it.code) ? 'done' : (vWaiting(it).length ? 'locked' : 'ready');
const vCanWork = it => isAdmin() || myLessonAccess === 'work' || myFolderAccess === 'work' || myItemAccess[it.id] === 'work';
const shortCode = c => /^ASSET_/i.test(c) ? c.replace(/^ASSET_/i, '').replace(/\.png$/i, '') : c;

/* ---------- code ranges: "F1-F6, V3, all videos" ⇄ list of codes ---------- */
function parseCodes(text, items){
  const all = items.map(i => i.code), out = new Set(), unknown = [];
  const norm = String(text || '').replace(/\s*[-–—]\s*/g, '-').replace(/\ball\s+(frames|videos|assets)\b/gi, '@$1');
  norm.split(/[\s,;]+/).filter(Boolean).forEach(tok => {
    const k = tok.replace(/^@/, '').toLowerCase();
    if (['frames','videos','assets'].includes(k)) { items.filter(i => i.kind + 's' === k).forEach(i => out.add(i.code)); return; }
    let m = tok.match(/^([FV])(\d+)-[FV]?(\d+)$/i);
    if (m) {
      const p = m[1].toUpperCase(), a = +m[2], b = +m[3];
      for (let n = Math.min(a, b); n <= Math.max(a, b); n++) { const c = p + n; if (all.includes(c)) out.add(c); else unknown.push(c); }
      return;
    }
    const exact = all.find(c => c.toLowerCase() === tok.toLowerCase() || shortCode(c).toLowerCase() === tok.toLowerCase());
    if (exact) out.add(exact); else unknown.push(tok);
  });
  return {codes: [...out], unknown};
}
function compressCodes(codes){
  const groups = {F: [], V: []}, other = [];
  codes.forEach(c => { const m = c.match(/^([FV])(\d+)$/); if (m) groups[m[1]].push(+m[2]); else other.push(shortCode(c)); });
  const parts = [];
  ['F','V'].forEach(p => {
    const ns = [...new Set(groups[p])].sort((a, b) => a - b);
    for (let i = 0; i < ns.length; i++) {
      let j = i; while (j + 1 < ns.length && ns[j + 1] === ns[j] + 1) j++;
      parts.push(j > i ? `${p}${ns[i]}–${p}${ns[j]}` : `${p}${ns[i]}`); i = j;
    }
  });
  return [...parts, ...other].join(', ');
}

/* ---------- loading ---------- */
const natural = (a, b) => String(a).localeCompare(String(b), undefined, {numeric: true, sensitivity: 'base'});
const lessonSort = (a, b) => (parseInt(a.page) || 1e9) - (parseInt(b.page) || 1e9) || natural(a.title, b.title);
async function loadLessons(){
  const [L, F, O] = await Promise.all([
    sb.from('lessons').select('*'),
    sb.from('folders').select('*'),
    sb.rpc('lessons_overview'),
  ]);
  if (L.error) { console.warn('lessons', L.error); lessons = []; updateNav(); return; }
  lessons = L.data.sort(lessonSort);
  folders = F.error ? [] : F.data;
  lessonStats = {};
  (O.data || []).forEach(r => (lessonStats[r.lesson_id] = lessonStats[r.lesson_id] || []).push(r));
  if (isAdmin()) { const fm = await sb.from('folder_members').select('*'); folderMembers = fm.data || []; }
  else { const fm = await sb.from('folder_members').select('*').eq('user_id', me.id); folderMembers = fm.data || []; }
  if (curFolder && !folders.find(f => f.id === curFolder)) curFolder = null;
  updateNav();
  if (!curLesson) renderLessonList();
}
function updateNav(){
  const showVideos = isAdmin() || lessons.length > 0;
  $('#navVideos').hidden = !showVideos;
  $('#navTeam').hidden = !isAdmin();
  $('#nav').hidden = !(showVideos || isAdmin());
}
const folderById = id => folders.find(f => f.id === id);
function folderPath(id){ const out = []; let f = folderById(id), n = 0; while (f && n++ < 50) { out.unshift(f); f = folderById(f.parent_id); } return out; }
const childFolders = id => folders.filter(f => (f.parent_id || null) === (id || null)).sort((a, b) => natural(a.name, b.name));
function descendantIds(id){ const out = [id]; for (let i = 0; i < out.length; i++) folders.filter(f => f.parent_id === out[i]).forEach(f => out.push(f.id)); return out; }
// the strongest folder access a person has on a folder (through it or a folder above it)
function folderAccessFor(uid, folderId){
  let best = null;
  folderPath(folderId).forEach(f => { const m = folderMembers.find(x => x.folder_id === f.id && x.user_id === uid); if (m && (m.access === 'work' || !best)) best = m.access; });
  return best;
}
function folderStats(id){
  const ids = new Set(descendantIds(id));
  const rows = lessons.filter(l => ids.has(l.folder_id)).flatMap(l => lessonStats[l.id] || []);
  const total = rows.reduce((a, r) => a + r.total, 0), done = rows.reduce((a, r) => a + r.done, 0);
  return {lessons: lessons.filter(l => ids.has(l.folder_id)).length, pct: total ? Math.round(done / total * 100) : 0};
}
async function loadProgress(){
  if (!curLesson) return;
  const {data, error} = await sb.rpc('lesson_progress', {p_lesson: curLesson.id});
  if (error) return console.warn(error);
  vProgress = {}; data.forEach(r => vProgress[r.code] = r);
  lessonStats[curLesson.id] = data;
}
async function openLesson(id){
  const l = lessons.find(x => x.id === id);
  if (!l) { await loadLessons(); if (!lessons.find(x => x.id === id)) return toast('This lesson is not available to you', true); }
  curLesson = lessons.find(x => x.id === id);
  vOpen = null; Object.assign(vFilter, {status:'', mine:false, person:''});
  switchView('videos');
  $('#lessonList').hidden = true; $('#lessonView').hidden = false;
  $('#lessonView').innerHTML = '<div class="empty">Loading…</div>';
  const q = [
    sb.from('lesson_items').select('*').eq('lesson_id', id).order('seq'),
    sb.from('lesson_errors').select('*').eq('lesson_id', id).order('seq'),
    sb.from('lesson_members').select('*').eq('lesson_id', id),
    sb.from('item_members').select('*').eq('lesson_id', id),

  ];
  const [it, er, lm, im] = await Promise.all(q);

  vErrors = er.data || [];
  lessonMembers = lm.data || []; itemMembers = im.data || [];
  myLessonAccess = lessonMembers.find(m => m.user_id === me.id)?.access || null;
  myItemAccess = {}; itemMembers.filter(m => m.user_id === me.id).forEach(m => myItemAccess[m.item_id] = m.access);
  myFolderAccess = curLesson.folder_id ? folderAccessFor(me.id, curLesson.folder_id) : null;
  _narr = null;
  // employees land on the first section they have work in
  const kinds = ['asset','frame','video'].filter(k => vItems.some(i => i.kind === k));
  const workKind = kinds.find(k => vItems.some(i => i.kind === k && vCanWork(i)));
  vTab = isAdmin() ? (kinds.includes('frame') ? 'frame' : kinds[0] || 'frame') : (workKind || kinds[0] || 'frame');
  clearInterval(vProgTimer);
  vProgTimer = setInterval(async () => { if (curLesson && !$('#view-videos').hidden) { await loadProgress(); renderLesson(); } }, 60 * 1000);
  renderLesson();
}
async function loadReports(render = true){

  if (error) return console.warn(error);

function closeLesson(){
  if (curLesson) curFolder = curLesson.folder_id || null;

/* ---------- lesson list ---------- */
// works with one row per item ({kind, done: true/false}) and with summary rows ({kind, total, done: count})
function statsOf(rows){
  const tot = r => r.total != null ? r.total : 1, dn = r => r.total != null ? r.done : (r.done ? 1 : 0);
  const sum = (list, f) => list.reduce((a, r) => a + f(r), 0);
  const total = sum(rows, tot), done = sum(rows, dn);
  const pct = total ? Math.round(done / total * 100) : 0;
  return {pct, done, total,
    parts: ['asset','frame','video'].map(k => { const l = rows.filter(r => r.kind === k); return {k, d: sum(l, dn), t: sum(l, tot)}; }).filter(p => p.t)};
}
const bar = (pct, cls = '') => `<div class="pbar ${cls}"><i style="width:${pct}%"></i></div>`;
function lessonCard(l){

  return `<button class="lcard" data-l="${l.id}">

    <div class="ltitle">${esc(l.title)}</div>
    <div class="lprog">${bar(s.pct)}<b>${s.pct}%</b></div>
    <div class="lsub">${s.parts.map(p => `${KIND_LABEL[p.k]} ${p.d}/${p.t}`).join(' · ') || 'No items'}</div>
  </button>`;
}

        <p class="hint" style="margin:0 0 10px">Covers every lesson in “${esc(f.name)}” and its sub-folders — including lessons you upload later.
          For single lessons or single frames and videos, use the Access tab inside the lesson.</p>
        ${ppl.length ? `<div class="fa-list">${ppl.map(p => `<div class="fa-row">
          <div class="acc-who"><b>${esc(p.full_name || p.email)}</b><small>${esc(inherited(p.id) || jobName(p.job_role_id) || 'Employee')}</small></div>
          <div class="seg" data-u="${p.id}">${[['', 'None'], ['view', 'View'], ['work', 'Work on']].map(([v, l]) => `<button type="button" data-v="${v}" class="${own(p.id) === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        </div>`).join('')}</div>` : '<div class="hint">No employees yet — add them in the Team tab.</div>'}
        <div class="actions"><button class="btn" id="faSave">Save</button></div>
      </div>
    </form>`;
  $('#formDlg').showModal();

  $('#faForm').onsubmit = async e => {
    e.preventDefault(); $('#faSave').disabled = true;
    for (const seg of $('#formDlg').querySelectorAll('.seg[data-u]')) {
      const uid = seg.dataset.u, v = seg.querySelector('.on')?.dataset.v || '';
      if (v === own(uid)) continue;
      const {error} = await sb.rpc('set_folder_access', {p_folder: fid, p_user: uid, p_access: v || null});
      if (error) { $('#faSave').disabled = false; return fail(error); }
    }
    $('#formDlg').close(); toast('Folder access saved'); loadLessons();
  };
}

/* ---------- organize lessons that are not in a folder yet (Grade › Unit, by the cover's Passage line) ---------- */
function detectGUP(l){
  const text = [...Object.values(l.info || {}), l.title || ''].join(' \n ');
  const num = re => { const m = text.match(re); return m ? m[1] : ''; };
  return {grade: l.grade || num(/\bGrade\s*[:#]?\s*(\d+)/i), unit: l.unit || num(/\bUnit\s*[:#]?\s*(\d+)/i), page: l.page || num(/\b(?:Page|p\.)\s*[:#]?\s*(\d+)/i)};
}
function organizeDialog(){
  const loose = lessons.filter(l => !l.folder_id).map(l => ({l, ...detectGUP(l)}))
    .sort((a, b) => (+a.grade || 1e9) - (+b.grade || 1e9) || (+a.unit || 1e9) - (+b.unit || 1e9) || (+a.page || 1e9) - (+b.page || 1e9) || natural(a.l.title, b.l.title));
  const movable = loose.filter(x => x.grade && x.unit);
  const allFolders = folders.slice().sort((a, b) => natural(folderPath(a.id).map(f => f.name).join('/'), folderPath(b.id).map(f => f.name).join('/')));
  const def = allFolders.find(f => !f.parent_id && /english/i.test(f.name))?.id || '';
  $('#formDlg').innerHTML = `
    <form id="orgForm" class="bulkdlg">
      <div class="dlg-head"><h2>Organize lessons</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-body">
        <p class="hint" style="margin:0 0 8px">Moves the lessons that aren't in a folder into <b>Grade › Unit</b> folders, using the Grade and Unit written on each lesson's cover, sorted by page.
          Progress, Done marks, access and reports stay as they are. Lessons with no Grade or Unit on the cover stay where they are.</p>
        <label for="orgTarget">Put the Grade folders inside</label>
        <select id="orgTarget"><option value="">(top level)</option>${allFolders.map(f => `<option value="${f.id}" ${f.id === def ? 'selected' : ''}>${esc(folderPath(f.id).map(x => x.name).join(' › '))}</option>`).join('')}</select>
        <div class="table-wrap" style="margin-top:12px"><table class="table bulk">
          <tr><th>Lesson</th><th>Grade</th><th>Unit</th><th>Page</th><th>Goes to</th></tr>
          ${loose.map(x => `<tr>
            <td><b>${esc(x.l.title)}</b></td>
            <td>${x.grade ? esc(x.grade) : '<span class="warnc">—</span>'}</td>
            <td>${x.unit ? esc(x.unit) : '<span class="warnc">—</span>'}</td>
            <td>${x.page ? esc(x.page) : '—'}</td>
            <td class="org-dest" data-g="${esc(x.grade)}" data-u="${esc(x.unit)}"></td>
          </tr>`).join('')}
        </table></div>
        <div class="actions"><button class="btn" id="orgGo" ${movable.length ? '' : 'disabled'}>Move ${movable.length} lesson${movable.length === 1 ? '' : 's'}</button><span class="hint" id="orgMsg"></span></div>
      </div>
    </form>`;
  $('#formDlg').showModal();
  const showDest = () => {
    const base = folderPath($('#orgTarget').value || null).map(f => f.name);
    $('#formDlg').querySelectorAll('.org-dest').forEach(td => {
      td.innerHTML = td.dataset.g && td.dataset.u ? esc([...base, 'Grade ' + td.dataset.g, 'Unit ' + td.dataset.u].join(' › ')) : '<span class="hint">stays — move it by hand</span>';
    });
  };
  $('#orgTarget').onchange = showDest; showDest();
  $('#orgForm').onsubmit = async e => {
    e.preventDefault(); $('#orgGo').disabled = true;
    const target = $('#orgTarget').value || null;
    const findOrMake = async (parent, name, re) => {
      const hit = folders.find(f => (f.parent_id || null) === parent && re.test(f.name));
      if (hit) return hit.id;
      const {data, error} = await sb.from('folders').insert({name, parent_id: parent}).select().single();
      if (error) throw error;
      folders.push(data); return data.id;
    };
    let moved = 0;
    try {
      for (const x of loose) {
        const upd = {grade: x.grade || null, unit: x.unit || null, page: x.page || null};
        if (x.grade && x.unit) {
          $('#orgMsg').textContent = `Moving ${moved + 1} of ${movable.length}…`;
          const g = await findOrMake(target, `Grade ${x.grade}`, new RegExp(`^grade\\s*${x.grade}$`, 'i'));
          upd.folder_id = await findOrMake(g, `Unit ${x.unit}`, new RegExp(`^unit\\s*${x.unit}$`, 'i'));
        }
        const {error} = await sb.from('lessons').update(upd).eq('id', x.l.id);
        if (error) throw error;
        if (upd.folder_id) moved++;
      }
    } catch (err) { $('#orgGo').disabled = false; await loadLessons(); return fail(err); }
    $('#formDlg').close(); toast(`Moved ${moved} lesson${moved === 1 ? '' : 's'} into their folders`);
    curFolder = target; loadLessons();
  };
}

/* ---------- import packs (one or many) ---------- */
async function importPacks(files){
  files = files.filter(f => /\.docx$/i.test(f.name) && !/^~\$/.test(f.name));
  if (!files.length) return toast('Choose lesson packs as .docx files', true);
  if (typeof JSZip === 'undefined') return toast('The Word reader did not load — check the internet connection and refresh', true);
  const target = curFolder, targetName = folderPath(target).map(f => f.name).join(' › ') || 'Video production';
  $('#formDlg').innerHTML = `<div class="dlg-head"><h2>Reading ${files.length} pack${files.length > 1 ? 's' : ''}…</h2></div><div class="dlg-body"><div class="pbar"><i id="rdBar" style="width:0%"></i></div></div>`;
  $('#formDlg').showModal();
  const rows = [];
  for (let i = 0; i < files.length; i++) {
    try { rows.push({file: files[i], pack: await PackParser.parse(await files[i].arrayBuffer())}); }
    catch (e) { rows.push({file: files[i], error: e.message}); }
    const b = $('#rdBar'); if (b) b.style.width = Math.round((i + 1) / files.length * 100) + '%';
  }
  rows.sort((a, b) => (+(a.pack?.unit) || 1e9) - (+(b.pack?.unit) || 1e9) || (+(a.pack?.page) || 1e9) - (+(b.pack?.page) || 1e9) || natural(a.file.name, b.file.name));
  const ok = rows.filter(r => r.pack);
  const units = [...new Set(ok.map(r => r.pack.unit).filter(Boolean))];
  const existing = new Set(childFolders(target).map(f => f.name.toLowerCase()));
  const newUnits = units.filter(u => !existing.has(`unit ${u}`));
  const n = (p, k) => p.items.filter(i => i.kind === k).length;
  $('#formDlg').innerHTML = `
    <form id="bulkForm" class="bulkdlg">
      <div class="dlg-head"><h2>Upload ${ok.length} lesson${ok.length === 1 ? '' : 's'}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-body">
        <div class="hint">Into <b>${esc(targetName)}</b>. Each lesson goes into a <b>Unit</b> folder by the unit on its cover${newUnits.length ? ` — new: ${newUnits.map(u => 'Unit ' + esc(u)).join(', ')}` : ''}, sorted by page.</div>
        <div class="table-wrap" style="margin-top:10px"><table class="table bulk">
          <tr><th>Lesson</th><th>Unit</th><th>Page</th><th>Items</th><th></th></tr>
          ${rows.map((r, i) => r.pack ? `<tr>
            <td><b>${esc(r.pack.title)}</b><div class="sub-email">${esc(r.file.name)}</div></td>
            <td>${r.pack.unit ? esc(r.pack.unit) : '<span class="warnc">—</span>'}</td>
            <td>${r.pack.page ? esc(r.pack.page) : '<span class="warnc">—</span>'}</td>
            <td style="white-space:nowrap">${n(r.pack, 'frame')} F · ${n(r.pack, 'video')} V</td>
            <td>${r.pack.warnings.length ? `<span class="warnc" title="${esc(r.pack.warnings.join('\n'))}">⚠ ${r.pack.warnings.length}</span>` : '<span class="okt">✓</span>'}</td>
          </tr>` : `<tr><td colspan="4"><b>${esc(r.file.name)}</b><div class="sub-email">Could not read: ${esc(r.error)}</div></td><td><span class="warnc">✗</span></td></tr>`).join('')}
        </table></div>
        ${ok.some(r => !r.pack.unit) ? '<div class="note sub">Lessons without a unit on the cover stay directly in this folder.</div>' : ''}
        ${ok.some(r => r.pack.warnings.length) ? '<div class="note ret">Some packs have warnings (⚠ — hover to see). They will still be uploaded.</div>' : ''}
        <div class="actions"><button class="btn" id="bulkGo" ${ok.length ? '' : 'disabled'}>Upload ${ok.length} lesson${ok.length === 1 ? '' : 's'}</button><span class="hint" id="bulkMsg"></span></div>
      </div>
    </form>`;
  $('#bulkForm').onsubmit = async e => {
    e.preventDefault();
    $('#bulkGo').disabled = true;
    const unitFolder = {};
    for (const f of childFolders(target)) { const m = f.name.match(/^unit\s*(\d+)$/i); if (m) unitFolder[m[1]] = f.id; }
    let done = 0, failed = [];
    for (const r of ok) {
      $('#bulkMsg').textContent = `Uploading ${done + 1} of ${ok.length}…`;
      try {
        let folderId = target;
        if (r.pack.unit) {
          if (!unitFolder[r.pack.unit]) {
            const {data, error} = await sb.from('folders').insert({name: `Unit ${r.pack.unit}`, parent_id: target}).select().single();
            if (error) throw error;
            unitFolder[r.pack.unit] = data.id;
          }
          folderId = unitFolder[r.pack.unit];
        }
        await createLesson(r.pack, folderId, null);
        done++;
      } catch (err) { console.error(err); failed.push(`${r.pack.title}: ${err.message}`); }
    }
    $('#formDlg').close();
    await loadLessons();
    if (failed.length) toast(`Uploaded ${done}; ${failed.length} failed — ${failed[0]}`, true);
    else toast(`Uploaded ${done} lesson${done === 1 ? '' : 's'}`);
  };
}
async function createLesson(pack, folderId, passage){
  const {data: lesson, error} = await sb.from('lessons').insert({
    title: pack.title, info: pack.info, guide: pack.guide, escalation: pack.escalation, library: pack.library,
    passage: passage || null, folder_id: folderId || null, grade: pack.grade || null, unit: pack.unit || null, page: pack.page || null,
  }).select().single();
  if (error) throw error;
  const {error: e2} = await sb.from('lesson_items').insert(pack.items.map(i => ({
    lesson_id: lesson.id, kind: i.kind, code: i.code, seq: i.seq, title: i.title, prompt: i.prompt, deps: i.deps, meta: i.meta})));
  if (e2) { await sb.from('lessons').delete().eq('id', lesson.id); throw e2; }
  if (pack.errors.length) await sb.from('lesson_errors').insert(pack.errors.map((x, i) => ({lesson_id: lesson.id, code: x.code, problem: x.problem, seq: i + 1})));
  return lesson;
}

/* ---------- lesson view ---------- */
function renderLesson(){
  if (!curLesson) return;
  const rows = Object.values(vProgress);
  const s = statsOf(rows);
  const kinds = ['asset','frame','video'].filter(k => vItems.some(i => i.kind === k));
  if (!kinds.includes(vTab) && !['passage','reports','guide','access'].includes(vTab)) vTab = kinds[0] || 'guide';
  const openReports = vReports.filter(r => r.status === 'open').length;

  // progress by person: work items assigned (whole lesson "work" counts everything) and what they ticked
  let people = '';
  if (isAdmin()) {
    const fAcc = uid => curLesson.folder_id ? folderAccessFor(uid, curLesson.folder_id) : null;
    const ppl = profiles.filter(p => p.active && (lessonMembers.some(m => m.user_id === p.id) || itemMembers.some(m => m.user_id === p.id) || fAcc(p.id) || rows.some(r => r.done_by === p.id)));
    people = ppl.map(p => {
      const whole = lessonMembers.find(m => m.user_id === p.id)?.access === 'work' || fAcc(p.id) === 'work';
      const mineIds = whole ? vItems.map(i => i.id) : itemMembers.filter(m => m.user_id === p.id && m.access === 'work').map(m => m.item_id);
      const mine = vItems.filter(i => mineIds.includes(i.id));
      const d = mine.filter(i => vDone(i.code)).length;
      const pct = mine.length ? Math.round(d / mine.length * 100) : 0;
      return `<div class="pp"><span>${esc(p.full_name || p.email)}</span>${mine.length ? `${bar(pct, 'sm')}<small>${d}/${mine.length}</small>` : '<small>view only</small>'}</div>`;
    }).join('');
  } else {
    const mine = vItems.filter(vCanWork);
    if (mine.length) {
      const d = mine.filter(i => vDone(i.code)).length;
      people = `<div class="pp"><span>Your items</span>${bar(Math.round(d / mine.length * 100), 'sm')}<small>${d}/${mine.length}</small></div>`;
    }
  }

  const tabs = [...kinds.map(k => [k, `${KIND_LABEL[k]} <small>${vItems.filter(i => i.kind === k && vDone(i.code)).length}/${vItems.filter(i => i.kind === k).length}</small>`]),
    ['passage', 'Passage'], ['reports', `Reports${openReports ? ` <b class="cnt">${openReports}</b>` : ''}`], ['guide', 'Guide'],
    ...(isAdmin() ? [['access', 'Access']] : [])];

  $('#lessonView').innerHTML = `
    <div class="crumbs"><button class="crumb" id="backLessons">← ${esc(folderPath(curLesson.folder_id).at(-1)?.name || 'All lessons')}</button>${folderPath(curLesson.folder_id).length ? `<span class="hint">${esc(folderPath(curLesson.folder_id).map(f => f.name).join(' › '))}</span>` : ''}</div>
    <div class="lhead">
      <div class="lhead-main">
        <h2 class="vh2">${esc(curLesson.title)}</h2>
        <div class="chips">${[curLesson.grade ? ['Grade', curLesson.grade] : null, curLesson.unit ? ['Unit', curLesson.unit] : null, curLesson.page ? ['Page', curLesson.page] : null].filter(Boolean).map(([k, v]) => `<span class="chip"><b>${k}</b> ${esc(v)}</span>`).join('')}${Object.entries(curLesson.info || {}).filter(([k]) => /passage|world|flow/i.test(k)).map(([k, v]) => `<span class="chip"><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>
      </div>
      <div class="lhead-prog">
        <div class="lprog big">${bar(s.pct)}<b>${s.pct}%</b></div>
        <div class="lsub">${s.parts.map(p => `${KIND_LABEL[p.k]} ${p.d}/${p.t}`).join(' · ')}</div>
        ${people ? `<div class="people">${people}</div>` : ''}
      </div>
    </div>
    <div class="vtabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" class="${vTab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="vBody"></div>`;
  $('#backLessons').onclick = closeLesson;
  $('#lessonView').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { vTab = b.dataset.tab; vOpen = null; renderLesson(); });
  if (['asset','frame','video'].includes(vTab)) renderItems();
  else ({passage: renderPassage, reports: renderReports, guide: renderGuide, access: renderAccess})[vTab]();
}

function renderItems(){
  const workMine = vItems.some(i => i.kind === vTab && vCanWork(i)) && vItems.some(i => i.kind === vTab && !vCanWork(i));
  const admins = isAdmin();
  const assignees = it => {
    const ids = new Set(itemMembers.filter(m => m.item_id === it.id && m.access === 'work').map(m => m.user_id));
    lessonMembers.filter(m => m.access === 'work').forEach(m => ids.add(m.user_id));
    if (curLesson.folder_id) profiles.filter(p => folderAccessFor(p.id, curLesson.folder_id) === 'work').forEach(p => ids.add(p.id));
    return [...ids];
  };
  let list = vItems.filter(i => i.kind === vTab);
  if (vFilter.status) list = list.filter(i => vStatus(i) === vFilter.status);
  if (vFilter.mine) list = list.filter(vCanWork);
  if (admins && vFilter.person) list = list.filter(i => assignees(i).includes(vFilter.person));
  const people = profiles.filter(p => p.active && (lessonMembers.some(m => m.user_id === p.id && m.access === 'work') || itemMembers.some(m => m.user_id === p.id && m.access === 'work') || (curLesson.folder_id && folderAccessFor(p.id, curLesson.folder_id) === 'work')));

  $('#vBody').innerHTML = `
    <div class="vfilters">
      <div class="seg">${[['', 'All'], ['ready', 'Ready'], ['locked', 'Waiting'], ['done', 'Done']].map(([k, l]) => `<button class="${vFilter.status === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('')}</div>
      ${workMine ? `<label class="tog"><input type="checkbox" id="vMine" ${vFilter.mine ? 'checked' : ''}> Only items I work on</label>` : ''}
      ${admins && people.length ? `<label class="fgroup" style="flex:0 1 220px"><span>Assigned to</span><select id="vPerson"><option value="">Anyone</option>${people.map(p => `<option value="${p.id}" ${vFilter.person === p.id ? 'selected' : ''}>${esc(p.full_name || p.email)}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="vlist">${list.length ? list.map(it => itemRow(it, admins ? assignees(it) : [])).join('') : '<div class="empty">Nothing here with this filter.</div>'}</div>`;

  $('#vBody').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { vFilter.status = b.dataset.st; renderItems(); });
  const mineBox = $('#vMine'); if (mineBox) mineBox.onchange = () => { vFilter.mine = mineBox.checked; renderItems(); };
  const ps = $('#vPerson'); if (ps) ps.onchange = () => { vFilter.person = ps.value; renderItems(); };
  $('#vBody').querySelectorAll('.vrow').forEach(row => {
    const it = vItems.find(i => i.id === row.dataset.id);
    row.querySelector('[data-act="done"]')?.addEventListener('click', () => toggleDone(it));
    row.querySelector('[data-act="copy"]')?.addEventListener('click', () => copyPrompt(it));
    row.querySelector('[data-act="more"]')?.addEventListener('click', () => { vOpen = vOpen === it.id ? null : it.id; renderItems(); });
    row.querySelector('[data-act="report"]')?.addEventListener('click', () => openReportForm(it));
    row.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', () => jumpTo(a.dataset.jump)));
    row.querySelector('[data-act="copyfull"]')?.addEventListener('click', () => copyPrompt(it));
  });
  if (vOpen) { const r = $(`.vrow[data-id="${vOpen}"]`); if (r) r.scrollIntoView({block:'nearest'}); }
}

function depChip(code){
  const d = vDone(code), it = vByCode(code);
  const label = shortCode(code);
  return it ? `<button class="dep ${d ? 'ok' : ''}" data-jump="${esc(code)}" title="${d ? 'Done' : 'Not done yet'} — open ${esc(label)}">${d ? '✓' : '•'} ${esc(label)}</button>`
            : `<span class="dep ${d ? 'ok' : ''}" title="${d ? 'Done' : 'Not done yet'}">${d ? '✓' : '•'} ${esc(label)}</span>`;
}
function itemRow(it, assignedIds){
  const st = vStatus(it), work = vCanWork(it), waiting = vWaiting(it), open = vOpen === it.id;
  const p = vProgress[it.code] || {};
  const canTick = work && (st !== 'locked' || isAdmin() || vDone(it.code));
  const stChip = st === 'done' ? '<span class="badge s-ok">Done</span>'
    : st === 'locked' ? `<span class="badge s-prog">Waiting for ${esc(waiting.map(shortCode).join(', '))}</span>`
    : '<span class="badge s-new">Ready</span>';
  let links = '';
  if (it.kind === 'video') links = `<span class="flow">${depChip(it.meta.start)}<span class="arrow">→</span>${depChip(it.meta.end)}</span>`;
  else if (it.kind === 'frame') {
    const nextV = vItems.find(v => v.kind === 'video' && v.meta?.start === it.code);
    const deps = (it.deps || []).filter(d => d !== it.code);
    links = `${deps.length ? `<span class="flow"><small>Needs</small> ${deps.map(depChip).join('')}</span>` : ''}${nextV ? `<button class="vlink" data-jump="${esc(nextV.code)}" title="Video that starts with this frame">▶ ${esc(nextV.code)} · ${esc(nextV.meta.start)} → ${esc(nextV.meta.end)}</button>` : ''}`;
  }
  const filled = promptFor(it);
  const nar = it.kind === 'video' && filled.used ? narration().map[it.code] : null;
  const chunk = nar?.text || '';
  const who = assignedIds.length ? `<span class="who">👤 ${assignedIds.map(id => esc(nameOf(id))).join(', ')}</span>` : '';
  const doneBy = vDone(it.code) && p.done_by ? `<span class="who">✓ ${esc(nameOf(p.done_by))} · ${fmtDT(p.done_at)}</span>` : '';
  const openRep = vReports.filter(r => r.item_id === it.id && r.status === 'open').length;

  return `<div class="vrow st-${st} ${vDone(it.code) ? 'is-done' : ''} ${open ? 'open' : ''}" data-id="${it.id}">
    <div class="vline">
      <button class="vcheck" data-act="done" ${canTick ? '' : 'disabled'} aria-pressed="${vDone(it.code)}"
        title="${!work ? 'View only — you can’t mark this' : st === 'locked' && !vDone(it.code) && !isAdmin() ? 'Waiting for ' + waiting.join(', ') : vDone(it.code) ? 'Mark as not done' : 'Mark as done'}">${vDone(it.code) ? '✓' : ''}</button>

async function toggleDone(it){

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
async function copyPrompt(it){
  const f = promptFor(it);
  const ok = await copyText(f.text);
  if (!ok) { vOpen = it.id; renderItems(); return toast('Copy was blocked — select the prompt under Details and copy it', true); }
  if (f.missing) toast(`Copied ${shortCode(it.code)} — but the passage is missing, the [PASTE] line is still in it`, true);
  else toast(`Copied ${shortCode(it.code)} prompt`);
}

function splitPreview(text){
  // preview the text being typed without saving it
  const saved = curLesson.passage; curLesson.passage = text; _narr = null;
  const N = narration();
  curLesson.passage = saved; _narr = null;
  const vids = N.vids;
  if (!vids.length) return '<div class="hint">No video in this lesson has a [PASTE] line, so the passage isn\'t used.</div>';
  if (!String(text || '').trim()) return `<div class="hint">No passage yet. ${vids.length} story videos are waiting for it (${esc(compressCodes(vids.map(v => v.code)))}).</div>`;
  const found = vids.filter(v => N.map[v.code]?.text).length;
  let head;
  if (N.mode === 'exact') {
    head = `<div class="pssum"><b>${found}</b> of <b>${vids.length}</b> story videos found their lines in the passage</div>
      ${found < vids.length ? '<div class="note ret">Some lines were not found — check that the passage has the same wording as the pack (spelling, punctuation inside the words).</div>' : ''}`;
  } else {
    const avg = N.total / vids.length, empty = vids.length - found;
    let warn = '';
    if (empty) warn = `The passage has only ${N.sentences} sentence${N.sentences > 1 ? 's' : ''} for ${vids.length} videos — ${empty} video${empty > 1 ? 's get' : ' gets'} nothing.`;
    else if (avg > TARGET_WORDS * 1.35) warn = `That's about ${Math.round(avg)} words per video — more than ${TARGET_WORDS}. The narrator may need to speak fast, or the lesson needs more story videos.`;
    else if (avg < TARGET_WORDS * 0.65) warn = `That's only about ${Math.round(avg)} words per video — fewer than ${TARGET_WORDS}.`;
    head = `<div class="pssum"><b>${N.total}</b> words · <b>${N.sentences}</b> sentences · <b>${vids.length}</b> story videos · about <b>${Math.round(avg)}</b> words each</div>${warn ? `<div class="note ret">${esc(warn)}</div>` : ''}`;
  }
  return head + `<div class="psplit">${vids.map(v => {
    const r = N.map[v.code] || {}, c = r.text || '', n = PackParser.words(c.replace(/\b[\w. ]{1,40}:\s*"/g, '"'));
    const off = !c ? 'bad' : N.mode === 'even' && (n > TARGET_WORDS * 1.6 || n < TARGET_WORDS * 0.5) ? 'warn' : '';
    return `<div class="pschunk ${off}"><div class="psc-h"><b>${esc(v.code)}</b><span>${esc(v.title || '')}</span><small>${c ? n + ' words' : 'not found'}</small></div>
      <div class="psc-t">${c ? esc(c) : `<span class="bad">${esc((r.missing || []).join(' · ') || '—')}</span>`}</div></div>`;
  }).join('')}</div>`;
}

function shrinkImage(file, max = 1280, quality = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('encode')), 'image/jpeg', quality);
    };
    img.onerror = reject; img.src = url;
  });
}

                <button type="button" class="btn sm" data-apply="${k}">Apply</button>
              </div>` : ''}
              <div class="ax-grid">${its.map(i => `<button type="button" class="ax-it" data-code="${esc(i.code)}" title="${esc(shortCode(i.code))} — ${esc(i.title || '')}${others[i.code] ? '\nWorked on by ' + esc(others[i.code].join(', ')) : ''}">
                <b>${esc(shortCode(i.code))}</b>${others[i.code] ? `<i>${esc(others[i.code].map(n => n[0]).join(''))}</i>` : ''}</button>`).join('')}</div>
            </div>`;
          }).join('')}
          <div class="ax-legend"><span><i class="lg work"></i>Work on</span><span><i class="lg view"></i>View</span><span><i class="lg none"></i>No access</span><span><i class="lg oth">A</i>Someone else works on it</span></div>
        </div>
        <div class="actions"><button class="btn" id="axSave">Save access</button><span class="hint" id="axSum"></span></div>
      </div>
    </form>`;
  $('#formDlg').showModal();
  $('#axWhole').value = whole;

  const paint = () => {
    $('#axPick').classList.toggle('dim', !!whole);
    $('#formDlg').querySelectorAll('.ax-it').forEach(b => { const v = sel[b.dataset.code] || 'none'; b.className = 'ax-it ' + v; b.setAttribute('aria-pressed', v !== 'none'); });
    $('#formDlg').querySelectorAll('.ax-sec').forEach(sec => {
      const its = vItems.filter(i => i.kind === sec.dataset.kind);
      const w = its.filter(i => sel[i.code] === 'work').length, v = its.filter(i => sel[i.code] === 'view').length;
      sec.querySelector('.ax-cnt').textContent = [w ? `${w} work` : '', v ? `${v} view` : ''].filter(Boolean).join(' · ') || 'none';
    });
    $('#formDlg').querySelectorAll('[data-brush]').forEach(b => b.classList.toggle('on', b.dataset.brush === brush));
    const w = Object.keys(sel).filter(c => sel[c] === 'work'), v = Object.keys(sel).filter(c => sel[c] === 'view');
    $('#axSum').textContent = whole === 'work' ? 'Works on the whole lesson'
      : whole === 'view' ? 'Views the whole lesson' + (w.length ? ` and works on ${compressCodes(w)}` : '')
      : [w.length ? `Work on ${compressCodes(w)}` : '', v.length ? `View ${compressCodes(v)}` : ''].filter(Boolean).join(' · ') || 'No access';
  };
  const setCode = (c, v) => { if (v === 'none') delete sel[c]; else sel[c] = v; };
  $('#axWhole').onchange = () => { whole = $('#axWhole').value; paint(); };
  $('#formDlg').querySelectorAll('[data-brush]').forEach(b => b.onclick = () => { brush = b.dataset.brush; paint(); });
  $('#formDlg').querySelectorAll('.ax-it').forEach(b => b.onclick = () => {
    const c = b.dataset.code;
    setCode(c, sel[c] === brush ? 'none' : brush);   // clicking again with the same choice clears it
    paint();
  });
  $('#formDlg').querySelectorAll('[data-all]').forEach(b => b.onclick = () => { vItems.filter(i => i.kind === b.dataset.all).forEach(i => setCode(i.code, brush === 'none' ? 'none' : brush)); paint(); });
  $('#formDlg').querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { vItems.filter(i => i.kind === b.dataset.clear).forEach(i => setCode(i.code, 'none')); paint(); });
  $('#formDlg').querySelectorAll('[data-apply]').forEach(b => b.onclick = () => {
    const k = b.dataset.apply, its = vItems.filter(i => i.kind === k);
    let a = its.findIndex(i => i.code === $(`[data-from="${k}"]`).value), z = its.findIndex(i => i.code === $(`[data-to="${k}"]`).value);
    if (a > z) [a, z] = [z, a];
    its.slice(a, z + 1).forEach(i => setCode(i.code, brush));
    paint();
    toast(`${shortCode(its[a].code)}–${shortCode(its[z].code)}: ${brush === 'none' ? 'cleared' : brush === 'work' ? 'work on' : 'view'}`);
  });
  $('#accForm').onsubmit = async e => {
    e.preventDefault();
    const work = Object.keys(sel).filter(c => sel[c] === 'work');
    const view = whole ? [] : Object.keys(sel).filter(c => sel[c] === 'view');
    $('#axSave').disabled = true;
    const {error} = await sb.rpc('set_member_access', {p_lesson: curLesson.id, p_user: uid, p_lesson_access: whole || null,
      p_work: whole === 'work' ? [] : work, p_view: view});
    if (error) { $('#axSave').disabled = false; return fail(error); }
    const [lm, im] = await Promise.all([sb.from('lesson_members').select('*').eq('lesson_id', curLesson.id), sb.from('item_members').select('*').eq('lesson_id', curLesson.id)]);
    lessonMembers = lm.data || []; itemMembers = im.data || [];
    $('#formDlg').close();
    toast(`Saved for ${nameOf(uid)}`);
    renderLesson();
  };
  paint();
}

/* ---------- live updates ---------- */
let vRefreshTimer;
function onLessonItemChange(p){
  const row = p.new; if (!row || !curLesson || row.lesson_id !== curLesson.id) return;
  vProgress[row.code] = {...(vProgress[row.code] || {}), code: row.code, kind: row.kind, done: row.done, done_by: row.done_by, done_at: row.done_at};
  const it = vItems.find(i => i.id === row.id); if (it) Object.assign(it, {done: row.done, done_by: row.done_by, done_at: row.done_at});
  clearTimeout(vRefreshTimer);
  vRefreshTimer = setTimeout(async () => { await loadProgress(); if (!$('#view-videos').hidden && !$('#formDlg').open) renderLesson(); }, 400);
}

/* ---------- notifications ---------- */
function renderBell(){
  const n = notifs.filter(x => !x.read).length;
  $('#bellCount').hidden = !n; $('#bellCount').textContent = n > 99 ? '99+' : n;
  const p = $('#notifPanel');
  p.innerHTML = `<div class="nh">Notifications ${n ? `<button class="btn ghost sm" id="readAll">Mark all read</button>` : ''}</div>` +
    (notifs.length ? notifs.map(x => `<div class="notif ${x.read ? '' : 'unread'}" data-id="${x.id}" data-task="${x.task_id || ''}" data-lesson="${x.lesson_id || ''}" data-folder="${x.folder_id || ''}">
      ${esc(x.message)}<small>${fmtDT(x.created_at)}</small></div>`).join('')
    : '<div class="notif" style="color:var(--muted);cursor:default">No notifications</div>');
  const ra = $('#readAll');
  if (ra) ra.onclick = async ev => {
    ev.stopPropagation();
    await sb.from('notifications').update({read: true}).eq('user_id', me.id).eq('read', false);
    notifs.forEach(x => x.read = true); renderBell();
  };
  p.querySelectorAll('.notif[data-id]').forEach(el => el.onclick = async () => {
    const x = notifs.find(y => y.id === el.dataset.id);
    if (x && !x.read) { x.read = true; sb.from('notifications').update({read: true}).eq('id', x.id).then(); renderBell(); }
    p.hidden = true;
    if (el.dataset.task) openTask(el.dataset.task);
    else if (el.dataset.folder) { curLesson = null; curFolder = el.dataset.folder; switchView('videos'); $('#lessonView').hidden = true; $('#lessonList').hidden = false; await loadLessons(); }
    else if (el.dataset.lesson) { await openLesson(el.dataset.lesson); if (/reported/.test(x?.message || '')) { vTab = 'reports'; renderLesson(); } }
  });
}
$('#bellBtn').onclick = e => { e.stopPropagation(); $('#notifPanel').hidden = !$('#notifPanel').hidden; };
document.addEventListener('click', e => { if (!$('#notifPanel').contains(e.target)) $('#notifPanel').hidden = true; });

/* ---------- dialogs ---------- */
document.addEventListener('click', e => { if (e.target.matches('[data-close]')) e.target.closest('dialog').close(); });
$('#taskDlg').addEventListener('close', () => { currentTaskId = null; });

/* ---------- boot ---------- */
(async () => {
  if (SUPABASE_URL.includes('YOUR-PROJECT')) { showLogin('Add SUPABASE_URL and SUPABASE_ANON_KEY at the top of the code'); return; }
  const {data: {session}} = await sb.auth.getSession();
  if (session) await enter(session.user); else showLogin();
})();
</script>
</body>
